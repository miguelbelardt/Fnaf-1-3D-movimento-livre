}

/* ---- fluxo da noite: entrar → trabalhar → 6 AM → sair → casa ---- */
function enterPizzeria() {
  if (G.busy) return;
  Snd.door();
  transition('Entrando na pizzaria…', () => {
    G.loc = 'in'; P.x = 2.2; P.z = -36.4; P.yaw = Math.PI; P.pitch = 0;
    Snd.door();
    toast('As portas trancaram atrás de você. Sem energia: use a lanterna (F)');
    G.toastT = 4;
    updateHud();
  });
}
function dawnNow() {
  G.dawn = true; G.hour = 6; G.t = 6 * CONFIG.hourSeconds;
  closeMonitorSilent(); G.use = null; G.genProg = 0; G.flash = false;
  doors.L.closed = false; doors.R.closed = false;
  Snd.setBuzz(0); Snd.chime();
  Animatronics.dawn();
  toast('6 AM! Os robôs desligaram. Vá até a SAÍDA do saguão'); G.toastT = 5;
  updateHud();
}
function exitPizzeria() {
  if (G.busy) return;
  Snd.door();
  transition('Saindo da pizzaria…', () => {
    G.loc = 'out'; P.x = OX; P.z = -1.4; P.yaw = Math.PI; P.pitch = 0; G.flash = false;
    Snd.setHum(0);
    toast('Amanheceu. Vá até o seu carro'); G.toastT = 4;
    updateHud();
  });
}
function goHome() {
  if (G.busy) return;
  Snd.door();
  transition('Indo para casa…', () => win());
}
function win() {
  const done = G.night;
  G.state = 'win';
  closeMonitorSilent();
  unlock();
  hideHud();
  Snd.setHum(0); Snd.setBuzz(0);
  G.night = Math.min(99, done + 1); if (!MP.role) saveGame();
  showScreen('NOITE ' + done + ' CONCLUÍDA',
    '<p>Você dirigiu para casa e descansou…<br>Mas amanhã tem turno de novo.</p>' +
    (MP.role === 'guest' ? '<p><i>Aguardando o host iniciar a próxima noite…</i></p>' + mbtn('mpleave', 'SAIR DA SALA')
      : mbtn('play', '▶ VOLTAR AO TRABALHO — NOITE ' + G.night, 'main') + mbtn('menu', 'MENU')), '', 'menu');
}
function lose(reason) {
  if (G.state === 'over') return;
  G.state = 'over';
  G.scare = null; G.busy = false;
  closeMonitorSilent();
  unlock();
  hideHud();
  Snd.setHum(0); Snd.setBuzz(0); Snd.fail();
  G.dead = false; G.pendingOver = null;
  if (MP.role === 'host') mpEmit('over', { reason: reason || '' });
  showScreen('GAME OVER', '<p>' + (reason || '') + '</p>' + (MP.role === 'guest' ? '<p><i>Aguardando o host tentar de novo…</i></p>' + mbtn('mpleave', 'SAIR DA SALA')
    : mbtn('play', '↻ TENTAR DE NOVO — NOITE ' + G.night, 'main') + mbtn('menu', 'MENU')), '', 'menu');
}
screenEl.addEventListener('click', e => {
  const b = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'cfg') openSettings();
  else if (act === 'help') openHelp();
  else if (act === 'menu') showMenu();
  else if (act === 'new') { G.night = 1; saveGame(); beginNight(); }
  else if (act === 'night') { G.night = +b.dataset.n || 1; saveGame(); beginNight(); }
  else if (act === 'play') beginNight();
  else if (act === 'mp') mpOpenWin();
  else if (act === 'mpleave') { mpLeave(); showMenu(); }
});

/* ===== CONFIGURAÇÕES (Esc ou botão ⚙) ===== */
const setEl = $('settings');
const SLIDERS = { sens: 'c_sens', tsens: 'c_tsens', fov: 'c_fov', vol: 'c_vol' };
const fmtCfg = (k, v) => k === 'fov' ? Math.round(v) + '°' : k === 'vol' ? Math.round(v * 100) + '%' : (+v).toFixed(2) + '×';
function applyCfg() {
  camera.fov = CFG.fov; camera.updateProjectionMatrix();
  renderer.setPixelRatio(basePR * CFG.res); renderer.setSize(innerWidth, innerHeight);
  Snd.setVol(CFG.vol);
}
function syncCfgUI() {
  Object.keys(SLIDERS).forEach(k => { $(SLIDERS[k]).value = CFG[k]; $('v_' + k).textContent = fmtCfg(k, CFG[k]); });
  $('c_res').value = String(CFG.res); $('c_invy').checked = !!CFG.invY;
}
Object.keys(SLIDERS).forEach(k => $(SLIDERS[k]).addEventListener('input', e => {
  CFG[k] = +e.target.value; $('v_' + k).textContent = fmtCfg(k, CFG[k]); applyCfg(); saveCfg();
}));
$('c_res').addEventListener('change', e => { CFG.res = +e.target.value; applyCfg(); saveCfg(); });
$('c_invy').addEventListener('change', e => { CFG.invY = e.target.checked; saveCfg(); });
function openSettings() {
  if (G.cfg) return;
  G.cfg = true;
  for (const k in keys) keys[k] = false;
  endJoy(); interactUp();
  syncCfgUI();
  $('s_restart').style.display = (G.state === 'playing' && MP.role !== 'guest') ? 'block' : 'none';
  $('s_menu').style.display = G.state === 'menu' ? 'none' : 'block';
  setEl.style.display = 'flex';
  unlock();
}
function closeSettings() {
  if (!G.cfg) return;
  G.cfg = false;
  setEl.style.display = 'none';
  if (G.state === 'playing' && !G.monitor) { lockFail = false; lock(); }
}
setEl.addEventListener('click', e => {
  const b = e.target.closest ? e.target.closest('[data-s]') : null;
  if (!b) return;
  const a = b.dataset.s;
  if (a === 'close') closeSettings();
  else if (a === 'full') { try { const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen).call(d); } catch (er) {} }
  else if (a === 'defaults') { Object.assign(CFG, CFG_DEF); syncCfgUI(); applyCfg(); saveCfg(); }
  else if (a === 'restart') { G.cfg = false; setEl.style.display = 'none'; beginNight(); }
  else if (a === 'menu') { G.cfg = false; setEl.style.display = 'none'; unlock(); if (MP.role) mpLeave(); showMenu(); }
});
$('gear').addEventListener('click', () => { if (G.state === 'playing') { if (G.cfg) closeSettings(); else openSettings(); } });
// Esc com o mouse travado: o navegador solta o mouse sozinho → abre o painel
let wasLocked = false;
document.addEventListener('pointerlockchange', () => {
  const l = isLocked();
  if (wasLocked && !l && G.state === 'playing' && !G.monitor && !G.busy && !G.cfg) openSettings();
  wasLocked = l;
});

/* ===== AÇÕES ===== */
const canInteract = () => G.state === 'playing' && !G.monitor && !G.busy && !G.dead;
function playerInGap(s) {
  const dx = s === 'L' ? -2 : 2;
  const hit = (x, z) => Math.abs(x - dx) < P.r + 0.2 && z > DOOR.z0 - P.r && z < DOOR.z1 + P.r;
  if (hit(P.x, P.z)) return true;
  if (MP.role === 'host') for (const id in MP.players) { const q = MP.players[id]; if (q.alive && q.loc === 'in' && hit(q.x, q.z)) return true; }
  return false;
}
function toggleDoor(side, from) {   // from = id do convidado que pediu (só no host)
  if (!from && !canInteract()) return;
  if (MP.role === 'guest') { mpSendHost({ t: 'act', k: 'door', side }); return; }
  if (G.powerOut) { if (from) mpSendTo(from, { t: 'evt', k: 'toast', msg: 'Sem energia — a porta não responde' }); else toast('Sem energia — a porta não responde'); return; }
  if (!doors[side].closed && playerInGap(side)) { if (from) mpSendTo(from, { t: 'evt', k: 'toast', msg: 'Tem alguém na porta!' }); else toast('Tem alguém na porta!'); return; }
  doors[side].closed = !doors[side].closed;
  Snd.door();
  refreshButtons();
  Animatronics.onDoorChange(side, doors[side].closed);
}
function powerOutNow() {
  G.powerOut = true;
  G.use = null; G.genProg = 0;
  doors.L.closed = false; doors.R.closed = false;
  if (G.monitor) { closeMonitorSilent(); lock(); }
  refreshButtons();
  Snd.setHum(0); Snd.setBuzz(0); Snd.blackout();
  Animatronics.onPowerOut();
}
function restorePower() {
  const first = G.arrive;   // 1ª vez: energia ligada ao chegar, a noite só começa agora
  G.powerOut = false;
  if (first) { G.arrive = false; G.t = 0; G.hour = 0; G.power = CONFIG.startPower; }
  else { G.power = Math.max(8, CONFIG.genRestore - 6 * G.genUses); G.genUses++; }
  G.acc = 0; G.genProg = 0; G.use = null;
  Snd.setHum(0.035); Snd.genOn();
  refreshButtons();
  toast(first ? 'Energia ligada! Vá ao escritório e sobreviva até as 6 AM' : 'Energia restaurada: ' + Math.floor(G.power) + '%');
  if (!first) Animatronics.onPowerRestore(G.genUses);
}

// alvo sob a mira (centro da tela)
const ray = new THREE.Raycaster();
const CENTER = new THREE.Vector2(0, 0);
let occluders = null;   // tudo que bloqueia a mira (paredes, portas, móveis...)
function buildOccluders() {
  occluders = [];
  scene.traverse(o => { if (o.isMesh && !o.userData.noOcc && clickables.indexOf(o) < 0) occluders.push(o); });
}
// Marca de luz da lanterna: como a luz do three r128 é por vértice, desenha um círculo de luz exatamente
// onde a mira aponta (parede, chão ou móvel), para o feixe ficar legível.
const spotTex = tex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,244,214,0.5)'); gr.addColorStop(0.5, 'rgba(255,240,200,0.22)'); gr.addColorStop(1, 'rgba(255,240,200,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const flashSpot = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ map: spotTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
flashSpot.visible = false; flashSpot.userData.noOcc = true;
scene.add(flashSpot);
let spotTick = 0;
function updateFlashSpot(on) {
  if (!on) { flashSpot.visible = false; return; }
  if ((spotTick++ & 1) && flashSpot.visible) return;   // a cada 2 quadros
  if (!occluders) buildOccluders();
  ray.setFromCamera(CENTER, camera);
  ray.far = 22;
  const h = ray.intersectObjects(occluders, false)[0];
  ray.far = Infinity;
  if (!h || !h.face || h.object.userData.robot) { flashSpot.visible = false; return; }
  const n = h.face.normal.clone().transformDirection(h.object.matrixWorld);
  if (n.dot(ray.ray.direction) > 0) n.negate();
  flashSpot.position.copy(h.point).addScaledVector(n, 0.03);
  flashSpot.lookAt(h.point.clone().add(n));
  const sz = clamp(h.distance * 0.6, 0.7, 3.5);
  flashSpot.scale.set(sz, sz, 1);
  flashSpot.visible = true;
}
function pick() {
  ray.setFromCamera(CENTER, camera);
  const hit = ray.intersectObjects(clickables, false)[0];
  if (!hit || hit.distance > CONFIG.reach) return null;
  // algo na frente do botão (parede, porta fechada...)? então não dá pra interagir
  if (!occluders) buildOccluders();
  ray.far = hit.distance - 0.002;
  const block = ray.intersectObjects(occluders, false)[0];
  ray.far = Infinity;
  return block ? null : hit.object.userData;
}
function interactDown() {
  if (G.dead && G.state === 'playing') { mpNextSpec(); return; }
  if (!canInteract()) return;
  const h = pick();
  if (!h) return;
  if (h.kind === 'door') toggleDoor(h.side);
  else if (h.kind === 'light') { if (!G.powerOut) { G.use = { kind: 'light', side: h.side }; mpSendHost({ t: 'act', k: 'use', kind: 'light', side: h.side, on: 1 }); } }
  else if (h.kind === 'gen') { if (G.powerOut) { G.use = { kind: 'gen' }; if (MP.role !== 'guest') G.genProg = 0; mpSendHost({ t: 'act', k: 'use', kind: 'gen', on: 1 }); } }
  else if (h.kind === 'monitor') toggleMonitor();
  else if (h.kind === 'nose') { Snd.honk(); if (MP.role === 'guest') mpSendHost({ t: 'act', k: 'honk' }); else mpEmit('honk'); }
  else if (h.kind === 'battery') takeBattery(h.idx);
  else if (h.kind === 'enter') {
    if (G.dawn) toast('Seu turno acabou. Vá para casa (carro)');
    else if (G.loc === 'out') enterPizzeria();
  }
  else if (h.kind === 'lobbydoor') {
    if (G.dawn) exitPizzeria(); else { Snd.lock(); toast('Trancadas até as 6 AM'); }
  }
  else if (h.kind === 'car') {
    if (G.dawn) goHome(); else toast(G.arrive ? 'Primeiro entre na pizzaria' : 'Seu turno ainda não acabou');
  }
}
function interactUp() {
  if (G.use) mpSendHost({ t: 'act', k: 'use', on: 0 });
  G.use = null;
  if (MP.role !== 'guest') G.genProg = 0;
}

/* ===== COLISÃO / MOVIMENTO ===== */
function blocked(x, z) {
  const r = P.r;
  for (const c of COL) {
    if (x + r > c.x1 && x - r < c.x2 && z + r > c.z1 && z - r < c.z2) return true;
  }
  for (const s of ['L', 'R']) {
    const d = doors[s];
    if (d.p < 0.6) {
      const dx = s === 'L' ? -2 : 2;
      if (x + r > dx - 0.06 && x - r < dx + 0.06 && z + r > DOOR.z0 && z - r < DOOR.z1) return true;
    }
  }
  return false;
}
function movePlayer(dx, dz) {
  if (!blocked(P.x + dx, P.z)) P.x += dx;
  if (!blocked(P.x, P.z + dz)) P.z += dz;
  if (G.loc === 'out') { P.x = clamp(P.x, OX - 30, OX + 30); P.z = clamp(P.z, -3.3, 29); }
  else { P.x = clamp(P.x, -16.6, 17.5); P.z = clamp(P.z, -37.05, 3.2); }
}

/* ===== ENTRADA ===== */
function look(dx, dy, sens) {
  const k = (sens || CONFIG.mouseSens) * (sens ? CFG.tsens : CFG.sens);
  P.yaw -= dx * k;
  P.pitch = clamp(P.pitch - dy * k * (CFG.invY ? -1 : 1), -1.45, 1.45);
}
addEventListener('mousemove', e => {
  if (G.state !== 'playing' || G.monitor) return;
  if (isLocked() || (lockFail && e.buttons)) look(e.movementX || 0, e.movementY || 0);
});
canvas.addEventListener('mousedown', () => {
  if (G.state === 'playing' && lockSupported && !lockFail && !isLocked() && !G.monitor) { lock(); return; }
  interactDown();
});
addEventListener('mouseup', interactUp);

// Alguns teclados (celular/Bluetooth) mandam solta+aperta repetidos ao segurar uma tecla (sem e.repeat).
// Para E/F/Espaço: um keyup seguido de keydown em até 70 ms conta como a MESMA pressão contínua.
const pressed = {}, relT = {};
function pressOnce(code) {
  if (relT[code]) { clearTimeout(relT[code]); relT[code] = null; return false; }   // repetição falsa: continua segurando
  if (pressed[code]) return false;
  pressed[code] = true;
  return true;
}
function releaseKey(code, fn) {
  if (relT[code]) clearTimeout(relT[code]);
  relT[code] = setTimeout(() => { relT[code] = null; pressed[code] = false; if (fn) fn(); }, 70);
}
addEventListener('keydown', e => {
  if (e.code === 'Escape' && $('helpWin').style.display === 'flex') { closeHelp(); return; }
  if (e.code === 'Escape') { if (!e.repeat) { if (G.cfg) closeSettings(); else if (G.state === 'playing') openSettings(); } return; }
  if (G.cfg) return;
  keys[e.code] = true;
  if (e.repeat) return;
  if ((e.code === 'Space' || e.code === 'KeyE' || e.code === 'KeyF') && !pressOnce(e.code)) { if (e.code === 'Space') e.preventDefault(); return; }
  if (e.code === 'Space') { e.preventDefault(); toggleMonitor(); }
  else if (e.code === 'KeyE') interactDown();
  else if (e.code === 'KeyF') toggleFlash();
  else if (G.monitor && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
    const i = CAM_ORDER.indexOf(G.cam);
    const n = (i + (e.code === 'ArrowRight' ? 1 : -1) + CAM_ORDER.length) % CAM_ORDER.length;
    selectCam(CAM_ORDER[n]);
  }
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space' || e.code === 'KeyE' || e.code === 'KeyF') releaseKey(e.code, e.code === 'KeyE' ? interactUp : null);
});
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  for (const k in relT) { clearTimeout(relT[k]); relT[k] = null; }
  for (const k in pressed) pressed[k] = false;
  interactUp();
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

/* ===== CONTROLES DE TOQUE (celular) ===== */
let touchRun = false;
function toggleFlash() {
  if (G.state === 'playing' && !G.monitor && !G.dead) {
    if (!G.flash && G.bat <= 0) { toast('Sem bateria! Procure pilhas pelo mapa'); return; }
    G.flash = !G.flash; Snd.click(); updateHud();
  }
}
const joy = { x: 0, y: 0, id: null, cx: 0, cy: 0, r: 55 };
let lookId = null, lookX = 0, lookY = 0;
function setJoy(t) {   // joy.r = raio de curso do botão (acompanha o tamanho do joystick na tela)
  let dx = t.clientX - joy.cx, dy = t.clientY - joy.cy;
  const d = Math.hypot(dx, dy);
  if (d > joy.r) { dx *= joy.r / d; dy *= joy.r / d; }
  $('knob').style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  const dz = joy.r * 0.15;
  joy.x = Math.abs(dx) < dz ? 0 : dx / joy.r;
  joy.y = Math.abs(dy) < dz ? 0 : dy / joy.r;
}
function endJoy() {
  joy.id = null; joy.x = 0; joy.y = 0;
  $('knob').style.transform = 'translate(0px,0px)';
}
function bindBtn(id, down, up) {
  const el = $(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); down(); }, { passive: false });
  const end = e => { e.preventDefault(); if (up) up(); };
  el.addEventListener('touchend', end, { passive: false });
  el.addEventListener('touchcancel', end, { passive: false });
}
{
  $('joy').addEventListener('touchstart', e => {
    e.preventDefault();
    if (joy.id !== null) return;
    const t = e.changedTouches[0];
    joy.id = t.identifier;
    const r = $('joy').getBoundingClientRect();
    joy.cx = r.left + r.width / 2; joy.cy = r.top + r.height / 2;
    joy.r = r.width * 0.37;
    setJoy(t);
  }, { passive: false });
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();   // também evita o "mouse falso" que o navegador dispara após o toque
    if (lookId !== null || G.state !== 'playing' || G.monitor) return;
    const t = e.changedTouches[0];
    lookId = t.identifier; lookX = t.clientX; lookY = t.clientY;
  }, { passive: false });
  addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) setJoy(t);
      else if (t.identifier === lookId) {
        if (G.state === 'playing' && !G.monitor) look(t.clientX - lookX, t.clientY - lookY, CONFIG.touchSens);
        lookX = t.clientX; lookY = t.clientY;
      }
    }
    if (joy.id !== null || lookId !== null) e.preventDefault();
  }, { passive: false });
  const endTouch = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) endJoy();
      if (t.identifier === lookId) lookId = null;
    }
  };
  addEventListener('touchend', endTouch);
  addEventListener('touchcancel', endTouch);
  bindBtn('bE', interactDown, interactUp);
  bindBtn('bF', toggleFlash);
  bindBtn('bCam', toggleMonitor);
  bindBtn('bRun', () => { touchRun = !touchRun; $('bRun').style.background = touchRun ? 'rgba(255,255,255,.45)' : ''; });
}

/* ===== RUÍDO DAS CÂMERAS ===== */
const noiseCv = $('noise'); noiseCv.width = 160; noiseCv.height = 90;
const noiseG = noiseCv.getContext('2d');
const noiseImg = noiseG.createImageData(160, 90);
let noiseFrame = 0;
function drawNoise() {
  const d = noiseImg.data;
  for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  noiseG.putImageData(noiseImg, 0, 0);
}

/* ===== LOOP ===== */
let clockTime = 0;
let outside = false;   // jogador fora da pizzaria
function update(dt) {
  clockTime += dt;

  const paused = isPaused();
  $('lockHint').style.display = (paused && !G.cfg) ? 'flex' : 'none';
  if (paused && !(MP.role && MP.started)) return;
  outside = G.loc === 'out';

  if (G.state === 'intro') {
    G.introT -= dt;
    if (G.introT <= 0) beginPlay();
  }

  mpDerive();
  if (G.state === 'playing') {
    // movimento (WASD)
    G.sprinting = false;
    if (!G.monitor && !G.busy && !G.dead && !G.cfg) {
      const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) - joy.y;
      const s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x;
      const want = !!(f || s), runKey = keys.ShiftLeft || keys.ShiftRight || touchRun;
      const run = runKey && want && G.stamina > 0 && !G.tired;
      G.sprinting = run;
      if (run) { G.stamina = Math.max(0, G.stamina - 20 * dt); G.stamT = 0.9; if (G.stamina <= 0) G.tired = true; }
      else { G.stamT -= dt; if (G.stamT <= 0) G.stamina = Math.min(100, G.stamina + (want ? 9 : 16) * dt); if (G.tired && G.stamina >= 30) G.tired = false; }
      if (want) {
        const len = Math.hypot(f, s);
        const step = (G.tired ? 1.8 : run ? CONFIG.runSpeed : CONFIG.walkSpeed) * dt / Math.max(1, len);
        const sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
        movePlayer((-sy * f + cy * s) * step, (-cy * f - sy * s) * step);
        P.bob += dt * (run ? 11 : 8);
      }
    }

    // relógio (só corre depois que a energia é ligada) — no multiplayer, o convidado recebe tudo do host
    if (MP.role !== 'guest' && !G.arrive && !G.dawn) {
      G.t += dt;
      const h = Math.floor(G.t / CONFIG.hourSeconds);
      if (h !== G.hour) G.hour = h;
      if (G.hour >= 6) dawnNow();
    }

    // energia
    if (MP.role !== 'guest') G.usage = computeUsage();
    if (MP.role === 'guest') { /* energia vem do snapshot do host */ }
    else if (G.dawn) { /* turno encerrado: energia não gasta */ }
    else if (!G.powerOut) {
      G.acc += dt;
      const interval = CONFIG.drainBase / Math.max(1, G.usage);
      while (G.acc >= interval) { G.acc -= interval; G.power = Math.max(0, G.power - 1); }
      if (G.power <= 0) powerOutNow();
    } else if ((G.use && G.use.kind === 'gen') || MP.genHolders > 0) {
      // ligando o gerador (segurar E); no multiplayer cada jogador segurando soma progresso
      G.genProg += dt * (((G.use && G.use.kind === 'gen') ? 1 : 0) + MP.genHolders);
      G.sputT -= dt;
      if (G.sputT <= 0) { Snd.sputter(); G.sputT = 0.35; }
      Animatronics.onGeneratorNoise(dt);
      if (G.genProg >= CONFIG.genTime) restorePower();
    }

    if (G.toastT > 0) G.toastT -= dt;
    if (MP.role !== 'guest' && !G.arrive && !G.dawn) Animatronics.update(dt);
    updateHud();
  }

  if (G.state === 'scare') Animatronics.updateScare(dt);
  updateCurtain(dt);
  mpTick(dt);
  G.shake = Math.max(0, G.shake - dt * 1.5);

  // portas
  for (const s of ['L', 'R']) {
    const d = doors[s];
    const target = d.closed ? 0 : 1;
    d.p += clamp(target - d.p, -dt * 4, dt * 4);
    d.mesh.position.y = doorY(d.p);
  }

  // luzes dos corredores
  let anyLight = false;
  for (const s of ['L', 'R']) {
    const on = lightOn(s);
    anyLight = anyLight || on;
    hallLight[s].intensity = on ? 1.6 * (0.85 + Math.random() * 0.15) : 0;
  }
  Snd.setBuzz(anyLight ? 0.03 : 0);
  refreshButtons();

  // iluminação geral (apaga no blecaute)
  const pw = G.powerOut ? 0 : 1;
  for (const e of roomLights) e.l.intensity = e.base * pw;
  if (G.lampFlick > 0) G.lampFlick -= dt;
  else if (!G.powerOut && Math.random() < 0.002) G.lampFlick = 0.12;
  officeLamp.intensity = pw * (G.lampFlick > 0 ? 0.25 : 1.0);
  stageLight.intensity = pw * 0.9 * (0.94 + Math.sin(clockTime * 3) * 0.06);
  ambient.intensity = Math.max((outside && !G.monitor) ? (G.dawn ? 0.8 : 0.34) : 0, G.powerOut ? 0.03 : (G.monitor ? 0.55 : 0.13));
  if (!G.monitor) scene.fog.density = outside ? 0.011 : 0.03;
  const skyHex = (outside && !G.monitor) ? (G.dawn ? 0x4a6fa0 : 0x0a1226) : 0x000000;   // céu noturno fora da pizzaria
  scene.background.setHex(skyHex); scene.fog.color.setHex(skyHex);

  // gerador: brilho vermelho no blecaute, verde com energia
  genBeacon.intensity = G.powerOut ? 0.7 + Math.sin(clockTime * 5) * 0.2 : 0;
  genLamp.material.color.setHex(G.powerOut ? 0xff2a1a : 0x33ff55);

  // lanterna
  const flashOn = G.flash && G.state === 'playing' && !G.monitor;
  if (flashOn) {   // a bateria gasta com a lanterna ligada (~2,5 min de uso contínuo)
    G.bat = Math.max(0, G.bat - dt * 0.67);
    if (G.bat <= 0) { G.flash = false; toast('A bateria da lanterna acabou!'); updateHud(); }
  }
  flash.intensity = 0;
  FL.uFl.value = flashOn ? (G.bat < 15 ? (Math.random() < 0.18 ? 0.1 : 0.45 + Math.random() * 0.4) : 0.97 + Math.random() * 0.03) : 0;
  updateFlashSpot(false);

  // ventilador
  if (!G.powerOut) {
    fanBlades.rotation.z += dt * 18;
    fanHead.rotation.y = Math.sin(clockTime * 0.8) * 0.55;   // oscila de um lado para o outro
  }

  // ruído / transição de câmera
  if (G.monitor) {
    G.staticT = Math.max(0, G.staticT - dt * 3);
    noiseCv.style.opacity = (0.1 + G.staticT * 0.8).toFixed(2);
    if ((noiseFrame++ % 3) === 0) drawNoise();
  }
}

function setCameraPose() {
  if (G.monitor) {
    const c = CAMS[G.cam];
    const sway = Math.sin(clockTime * 0.35) * 0.35;
    const dx = c.look[0] - c.pos[0], dz = c.look[2] - c.pos[2];
    const cs = Math.cos(sway), sn = Math.sin(sway);
    camera.position.set(c.pos[0], c.pos[1], c.pos[2]);
    camera.lookAt(c.pos[0] + dx * cs - dz * sn, c.look[1], c.pos[2] + dx * sn + dz * cs);
  } else {
    const sk = G.shake * 0.05;
    camera.position.set(P.x + (Math.random() - 0.5) * sk, P.eye + Math.sin(P.bob) * 0.025 + (Math.random() - 0.5) * sk, P.z + (Math.random() - 0.5) * sk);
    camera.rotation.set(P.pitch, P.yaw, 0);
  }
  camera.updateMatrixWorld();
}

function updatePrompt() {
  let txt = '';
  if (G.state === 'playing' && !G.monitor && !isPaused()) {
    if (G.use && G.use.kind === 'gen' && G.powerOut) {
      const pct = Math.floor(clamp(G.genProg / CONFIG.genTime, 0, 1) * 100);
      txt = 'Ligando gerador… ' + pct + '%';
    } else if (G.toastT > 0) {
      txt = G.toast;
    } else {
      const h = pick();
      if (h) {
        if (h.kind === 'door') txt = '[E] ' + (doors[h.side].closed ? 'Abrir' : 'Fechar') + ' porta';
        else if (h.kind === 'light') txt = '[E] Segurar luz do corredor';
        else if (h.kind === 'monitor') txt = '[E] Abrir câmeras';
        else if (h.kind === 'nose') txt = '[E] Apertar o nariz';
        else if (h.kind === 'battery') txt = '[E] Pegar pilha';
        else if (h.kind === 'enter') txt = G.dawn ? 'Seu turno acabou' : '[E] Entrar na pizzaria';
        else if (h.kind === 'lobbydoor') txt = G.dawn ? '[E] Sair da pizzaria' : 'Portas trancadas até as 6 AM';
        else if (h.kind === 'car') txt = G.dawn ? '[E] Ir para casa' : 'Seu carro';
        else if (h.kind === 'gen') txt = G.powerOut ? '[E] Segurar para ligar o gerador' : 'Gerador (energia ligada)';
      }
    }
  }
  const el = $('prompt');
  el.textContent = txt;
  el.style.display = txt ? 'block' : 'none';
  $('cross').style.display = (G.state === 'playing' && !G.monitor) ? 'block' : 'none';
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  setCameraPose();
  updatePrompt();
  renderer.render(scene, camera);
}

/* ===== MULTIPLAYER (co-op de até 5 jogadores) =====
   Sala por código/link, via WebRTC (PeerJS). O HOST roda toda a simulação (relógio, energia, portas, gerador, robôs);
   os convidados andam livremente, mandam posição/ações e recebem um "snapshot" do mundo ~12x por segundo. */

  }
  mpHudT -= dt;
  if (mpHudT <= 0) { mpHudT = 0.4; mpHud(); }
}
function mpHud() {
  let h = $('mpHud');
  if (!h) { h = document.createElement('div'); h.id = 'mpHud'; document.body.appendChild(h); }
  if (!MP.role || !MP.started || (G.state !== 'playing' && G.state !== 'scare')) { h.style.display = 'none'; return; }
  const aliveOf = id => id === MP.myId ? !G.dead : id === 'host' && MP.role === 'host' ? !G.dead : (mpOthers()[id] ? mpOthers()[id].alive !== false : false);
  h.innerHTML = MP.roster.map(r => '<span><i style="background:' + MPCOL[r.color % 10] + '"></i>' + esc(r.name) + (aliveOf(r.id) ? '' : ' ☠') + '</span>').join('');
  h.style.display = 'flex';
}

/* ---------- janela do multiplayer ---------- */
function mpOpenWin() { $('mpWin').style.display = 'flex'; mpRender(); }
function mpCloseWin() { $('mpWin').style.display = 'none'; }
function mpRender() {
  const w = $('mpWin');
  if (!w || w.style.display !== 'flex') return;
  const saved = (() => { try { return localStorage.getItem('fnaf3d-name') || ''; } catch (e) { return ''; } })();
  const prevName = $('mpName') ? $('mpName').value : (MP.name !== 'Jogador' ? MP.name : saved);
  const prevCode = $('mpCode') ? $('mpCode').value : (MP.ui.code || '');
  const roster = (MP.roster || []).map(r => '<div class="pl"><i style="background:' + MPCOL[r.color % 10] + '"></i>' + esc(r.name) + (r.id === 'host' ? ' <small>(host)</small>' : '') + (r.id === MP.myId ? ' <small>(você)</small>' : '') + '</div>').join('');
  let h = '<h2>MULTIPLAYER</h2>';
  if (!MP.role) {
    h += '<p>Jogue em grupo (até 5 pessoas) na mesma pizzaria. Uma pessoa cria a sala e passa o <b>código</b> ou o <b>link</b> para os outros.</p>' +
      '<p>Seu nome: <input id="mpName" maxlength="14" value="' + esc(prevName) + '" placeholder="Jogador"></p>' +
      '<h3>Criar uma sala (você é o host)</h3>' +
      '<p>Máximo de jogadores: <select id="mpMax">' + [2, 3, 4, 5].map(n => '<option value="' + n + '"' + (n === MP.max ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></p>' +
      '<button class="mb main" data-mp="create">CRIAR SALA</button>' +
      '<h3>Entrar numa sala</h3>' +
      '<p>Código: <input id="mpCode" maxlength="6" value="' + esc(prevCode) + '" placeholder="ABCD" style="text-transform:uppercase;width:7em"></p>' +
      '<button class="mb" data-mp="join">ENTRAR</button>';
  } else if (MP.role === 'host') {
    h += '<p>Sala criada! Passe o código ou o link para seus amigos.</p>' +
      '<div class="code">' + esc(MP.code) + '</div>' +
      '<p class="lnk">' + esc(mpLink()) + '</p>' +
      '<button class="mb" data-mp="copy">COPIAR LINK</button>' + (typeof navigator !== 'undefined' && navigator.share ? '<button class="mb" data-mp="share">COMPARTILHAR…</button>' : '') +
      '<h3>Jogadores (' + MP.roster.length + '/' + MP.max + ')</h3>' + roster +
      (MP.roster.length >= 2 ? '<button class="mb main" data-mp="start">▶ INICIAR NOITE ' + G.night + '</button>' : '<p><i>Aguardando alguém entrar…</i></p>') +
      '<button class="mb" data-mp="leave">FECHAR SALA</button>';
  } else {
    h += '<p>Você está na sala <b>' + esc(MP.code) + '</b>.</p><h3>Jogadores (' + MP.roster.length + '/' + MP.max + ')</h3>' + roster +
      '<p><i>Aguardando o host iniciar a noite…</i></p><button class="mb" data-mp="leave">SAIR DA SALA</button>';
  }
  if (MP.status) h += '<p class="st">' + esc(MP.status) + '</p>';
  $('mpBody').innerHTML = h;
}
function mpOpenFromMenu() { mpOpenWin(); }
function mpHostStart() {
  if (MP.role !== 'host' || MP.roster.length < 2) return;
  mpCloseWin();
  beginNight();   // startNight() avisa os convidados
}

/* ===== BOOT ===== */
window.FNAF = { toggleDoor, takeBattery, batteries, canInteract, MP, mpCreate, mpJoin, mpHostStart, mpLeave, mpSnap, setInputMode, getTouch: () => TOUCH, CFG, openSettings, closeSettings, OX, OUT, NAV, ROBOT, transition, enterPizzeria, exitPizzeria, dawnNow, goHome, pick, CONFIG, G, P, ROOMS, CAMS, GRAPH, ANCHORS, COL, doors, scene, camera, Animatronics, lose, win };
if (TOUCH) root.classList.add('touch');
loadGame();
applyCfg();
showMenu();
if (Q.get('sala')) { MP.ui.code = String(Q.get('sala')).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6); mpOpenWin(); }
requestAnimationFrame(frame);

})();
