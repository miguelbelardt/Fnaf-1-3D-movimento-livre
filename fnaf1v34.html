<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FNaF 1 3D</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",monospace;color:#fff;user-select:none;-webkit-user-select:none}
  #app canvas{display:block;touch-action:none}

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:10}
  #topRight{position:absolute;top:18px;right:28px;text-align:right;text-shadow:0 0 6px #000}
  #clock{font-size:40px;font-weight:bold}
  #nightLbl{font-size:22px;opacity:.85}
  #botLeft{position:absolute;left:28px;bottom:24px;text-shadow:0 0 6px #000}
  #powerTxt{font-size:24px;margin-bottom:6px}
  #usageTxt{font-size:20px;display:flex;align-items:center;gap:6px}
  #flashTxt{font-size:18px;margin-top:6px;opacity:.9}
  #bars{display:inline-flex;gap:3px}
  #bars i{display:block;width:14px;height:22px;background:#222;border:1px solid #000}
  #bars i.on.g{background:#38d13c}
  #bars i.on.y{background:#e6d82a}
  #bars i.on.r{background:#e03030}
  #objective{position:absolute;left:50%;top:20px;transform:translateX(-50%);font-size:20px;color:#ffd84a;text-shadow:0 0 6px #000;text-align:center;display:none;max-width:60%}

  /* Mira e prompts */
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.75);z-index:12;display:none;pointer-events:none}
  #prompt{position:fixed;left:50%;top:58%;transform:translateX(-50%);font-size:20px;text-shadow:0 0 6px #000;z-index:12;display:none;pointer-events:none;text-align:center}
  #lockHint{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;text-align:center;font-size:26px;z-index:40;cursor:pointer}

  /* Monitor de câmeras */
  #monitor{position:fixed;inset:0;display:none;pointer-events:none;z-index:20}
  #monitor.on{display:block}
  #noise{position:absolute;inset:0;width:100%;height:100%;opacity:.1;image-rendering:pixelated;mix-blend-mode:screen}
  #monitor .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0 2px,transparent 2px 4px)}
  #monitor .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%)}
  #audioOnly{position:absolute;inset:0;background:#050505;display:none;align-items:center;justify-content:center;text-align:center;font-size:30px;line-height:1.5;color:#bbb}
  #camLabel{position:absolute;top:22px;left:28px;font-size:26px;text-shadow:0 0 6px #000}
  #rec{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:26px;color:#e22;animation:blink 1.1s steps(1) infinite}
  #monHint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:16px;opacity:.85;text-shadow:0 0 6px #000}
  @keyframes blink{50%{opacity:0}}
  #map{position:absolute;right:24px;bottom:64px;width:270px;height:320px;border:3px solid #ddd;background:rgba(0,0,0,.45);pointer-events:auto}
  #map button{position:absolute;width:46px;height:28px;margin:-14px 0 0 -23px;padding:0;font:bold 13px "Courier New",monospace;color:#fff;background:#0a3a0a;border:2px solid #cfc;cursor:pointer}
  #map button.sel{background:#2f9a2f}
  #map .you{position:absolute;font-size:12px;color:#ddd;transform:translateX(-50%)}

  /* Telas (menu / vitória / derrota) */
  #screen{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;text-align:center;z-index:50;cursor:pointer}
  #screen .card{max-width:680px;padding:24px}
  #screen h1{font-size:44px;margin:0 0 12px}
  #screen p{font-size:18px;line-height:1.6;margin:8px 0;opacity:.92}
  #screen .go{margin-top:20px;font-size:20px;border:2px solid #fff;display:inline-block;padding:10px 22px;animation:blink 1.4s steps(1) infinite}
  #screen.intro{background:#000;cursor:default}
  #screen.intro .go{display:none}

  /* Controles de toque (celular) */
  html,body{touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #touch{position:fixed;inset:0;pointer-events:none;z-index:35;display:none}
  /* tamanhos proporcionais à altura da tela (vh) para caber em janelas baixas */
  #joy{position:absolute;left:min(24px,3vw);bottom:min(24px,5vh);width:min(150px,38vh);height:min(150px,38vh);border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:43%;height:43%;margin:-21.5% 0 0 -21.5%;border-radius:50%;background:rgba(255,255,255,.35)}
  .tb{position:absolute;pointer-events:auto;touch-action:none;width:min(64px,16vh);height:min(64px,16vh);border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);color:#fff;font:bold min(17px,4.2vh) "Courier New",monospace;padding:0}
  #bE{right:min(26px,3vw);bottom:min(30px,6vh);width:min(84px,21vh);height:min(84px,21vh);font-size:min(26px,6.5vh)}
  #bF{right:calc(min(26px,3vw) + min(84px,21vh) + 10px);bottom:min(30px,6vh)}
  #bCam{right:calc(min(26px,3vw) + min(84px,21vh) + 10px);bottom:calc(min(30px,6vh) + min(64px,16vh) + 10px)}
  #bRun{right:min(26px,3vw);bottom:calc(min(30px,6vh) + min(84px,21vh) + 10px);width:min(54px,13vh);height:min(54px,13vh);font-size:min(11px,2.8vh)}
  body.touch #botLeft{bottom:auto;top:min(14px,3vh);left:min(16px,2vw)}
  body.touch #powerTxt{font-size:min(18px,5vh);margin-bottom:2px}
  body.touch #usageTxt{font-size:min(15px,4vh)}
  body.touch #usageTxt #bars i{width:min(14px,3.4vh);height:min(22px,5vh)}
  body.touch #flashTxt{font-size:min(14px,3.6vh);margin-top:2px}
  body.touch #topRight{top:min(14px,3vh);right:min(20px,2.5vw)}
  body.touch #clock{font-size:min(30px,7.5vh)}
  body.touch #nightLbl{font-size:min(16px,4vh)}
  body.touch #objective{font-size:min(15px,3.8vh);top:min(64px,16vh)}
  body.touch #monHint{display:none}
  body.touch #map{right:auto;left:min(16px,2vw);bottom:min(16px,3vh);width:min(210px,68vh);height:min(190px,62vh)}
  body.touch #map button{width:min(46px,11vh);height:min(28px,7vh);margin:calc(min(28px,7vh) / -2) 0 0 calc(min(46px,11vh) / -2);font-size:min(13px,3.3vh)}
  body.touch #camLabel{font-size:min(20px,5vh);top:min(22px,4vh)}
  body.touch #rec{font-size:min(20px,5vh);top:min(22px,4vh)}
  body.mon #joy,body.mon #bE,body.mon #bF,body.mon #bRun{display:none}
  #rotate{display:none;position:fixed;inset:0;background:#000;z-index:60;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:24px}
  @media (orientation:portrait){body.touch #rotate{display:flex}}
  #stam{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:200px;height:12px;border:2px solid #fff;background:rgba(0,0,0,.5);display:none}
  #stam b{display:block;height:100%;width:100%;background:#4fd0ff}
  #stam.tired b{background:#e03030}
  #stam::after{content:"FÔLEGO";position:absolute;left:0;right:0;top:-16px;text-align:center;font-size:11px;opacity:.8}
  body.touch #stam{bottom:min(14px,3vh);width:min(160px,28vw)}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:45;display:flex;align-items:center;justify-content:center;font-size:26px;color:#ddd;text-align:center}
  #screen.menu{background:radial-gradient(ellipse at 50% 25%,#2e1650 0,#0a0612 72%);cursor:default}
  #screen.menu{align-items:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #screen.menu .card{margin:auto;padding:14px 24px}
  @media (max-height:560px){#screen.menu h1{font-size:28px;margin:0 0 4px}#screen.menu .sub{margin:2px 0 8px;font-size:13px}#screen.menu .mb{padding:6px 14px;font-size:15px;margin:4px 0}}
  #screen.menu h1{font-size:50px;letter-spacing:3px;color:#ffd84a;text-shadow:0 0 18px #7a3ad0;animation:flick 3s steps(1) infinite}
  @keyframes flick{0%,92%,96%{opacity:1}94%,98%{opacity:.55}}
  #screen .sub{opacity:.75;margin-bottom:18px}
  .mb{display:block;width:100%;margin:10px 0;padding:14px 18px;font:bold 20px "Courier New",monospace;color:#fff;background:rgba(255,255,255,.06);border:2px solid #fff;cursor:pointer;border-radius:4px}
  .mb:hover,.mb:active{background:rgba(255,216,74,.22);border-color:#ffd84a;color:#ffd84a}
  .mb.main{background:#ffd84a;color:#1a1020;border-color:#ffd84a}
  .mb.main:hover,.mb.main:active{background:#fff2a8;color:#1a1020}
  .nrow{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:12px 0}
  .nb{width:50px;height:44px;font:bold 20px "Courier New",monospace;color:#fff;background:transparent;border:2px solid #fff;cursor:pointer;border-radius:4px}
  .nb.sel{background:#ffd84a;color:#111;border-color:#ffd84a}
  .nb.dis{opacity:.28;pointer-events:none}
  #helpBox{text-align:left;max-height:36vh;overflow:auto;font-size:14px;line-height:1.5;background:rgba(0,0,0,.55);padding:6px 14px;border:1px solid #666;margin-top:8px}
  body.touch #screen.menu h1{font-size:34px}
  body.touch .mb{padding:8px 14px;font-size:16px;margin:6px 0}
  body.touch #helpBox{font-size:12px;max-height:44vh}
  #gear{position:absolute;right:28px;top:96px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.65);background:rgba(0,0,0,.45);color:#fff;font-size:24px;line-height:1;padding:0;pointer-events:auto;cursor:pointer;touch-action:manipulation}
  body.touch #gear{right:min(20px,2.5vw);top:min(62px,16vh);width:min(40px,10vh);height:min(40px,10vh);font-size:min(22px,5.5vh)}
  body.mon #gear{display:none}
  #helpWin{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:70;padding:10px}
  #helpWin .win{position:relative;max-width:760px;width:100%;max-height:92vh;overflow:auto;background:#150d22;border:2px solid #ffd84a;border-radius:6px;padding:18px 20px 20px;text-align:left;color:#fff;font-family:"Courier New",monospace}
  #helpWin h2{margin:0 36px 8px 0;color:#ffd84a;font-size:26px}
  #helpWin h3{margin:16px 0 6px;color:#ffd84a;font-size:17px}
  #helpWin p{margin:6px 0;font-size:15px;line-height:1.5;opacity:.93}
  #helpWin .x{position:absolute;top:8px;right:10px;width:36px;height:36px;font:bold 22px "Courier New",monospace;color:#fff;background:rgba(255,255,255,.08);border:2px solid #fff;border-radius:4px;cursor:pointer;line-height:1}
  #helpWin .x:hover,#helpWin .x:active{background:#c83a3a;border-color:#ff8a8a}
  #helpWin .bot{display:flex;gap:12px;align-items:center;margin:8px 0;padding:8px;background:rgba(255,255,255,.05);border:1px solid #555;border-radius:4px}
  #helpWin .bot canvas{flex:0 0 auto;width:84px;height:84px;background:#0a0612;border:1px solid #666;border-radius:4px}
  #helpWin .bot b{color:#ffd84a}
  body.touch #helpWin p{font-size:12px}
  body.touch #helpWin .bot canvas{width:64px;height:64px}
  #mpWin{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:70;padding:10px}
  #mpWin .win{position:relative;max-width:520px;width:100%;max-height:92vh;overflow:auto;background:#150d22;border:2px solid #ffd84a;border-radius:6px;padding:18px 20px 20px;text-align:left;color:#fff;font-family:"Courier New",monospace}
  #mpWin h2{margin:0 36px 8px 0;color:#ffd84a;font-size:26px}
  #mpWin h3{margin:14px 0 6px;color:#ffd84a;font-size:17px}
  #mpWin p{margin:6px 0;font-size:15px;line-height:1.5;opacity:.93}
  #mpWin input,#mpWin select{font:bold 16px "Courier New",monospace;padding:6px 8px;background:#0a0612;color:#fff;border:2px solid #777;border-radius:4px}
  #mpWin .x{position:absolute;top:8px;right:10px;width:36px;height:36px;font:bold 22px "Courier New",monospace;color:#fff;background:rgba(255,255,255,.08);border:2px solid #fff;border-radius:4px;cursor:pointer;line-height:1}
  #mpWin .x:hover,#mpWin .x:active{background:#c83a3a;border-color:#ff8a8a}
  #mpWin .code{font-size:54px;letter-spacing:10px;text-align:center;color:#ffd84a;margin:6px 0;font-weight:bold}
  #mpWin .lnk{word-break:break-all;font-size:12px;opacity:.7;text-align:center}
  #mpWin .pl{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:16px}
  #mpWin .pl i,#mpHud i{display:inline-block;width:12px;height:12px;border-radius:50%}
  #mpWin .st{color:#ff9a9a;font-weight:bold}
  #mpHud{position:fixed;top:6px;left:50%;transform:translateX(-50%);display:none;gap:10px;flex-wrap:wrap;justify-content:center;max-width:60vw;z-index:20;font:12px "Courier New",monospace;color:#fff;text-shadow:0 0 3px #000;pointer-events:none}
  #mpHud span{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:10px}
  body.touch #mpWin p,body.touch #mpWin .pl{font-size:12px}
  body.touch #mpWin .code{font-size:38px}
  #settings{position:fixed;inset:0;background:rgba(0,0,0,.84);display:none;align-items:center;justify-content:center;z-index:55;overflow:auto}
  #settings .card{width:min(440px,92vw);max-height:94vh;overflow:auto;padding:16px 22px;background:#12101a;border:2px solid #ffd84a;border-radius:6px;box-sizing:border-box}
  #settings h2{margin:0 0 10px;color:#ffd84a;font-size:24px;text-align:center}
  #settings label{display:block;margin:10px 0;font-size:16px}
  #settings label span{float:right;color:#ffd84a}
  #settings input[type=range]{display:block;width:100%;margin-top:6px;touch-action:manipulation}
  #settings select{display:block;width:100%;margin-top:6px;font:16px "Courier New",monospace;padding:6px;background:#000;color:#fff;border:1px solid #888}
  #settings .chk input{width:20px;height:20px;vertical-align:middle;margin-right:8px}
  #settings .mb{font-size:17px;padding:10px 14px;margin:8px 0}
  #settings .hint{font-size:12px;opacity:.6;text-align:center;margin:8px 0 0}
  body.touch #settings .card{padding:8px 16px}
  body.touch #settings h2{font-size:18px;margin-bottom:2px}
  body.touch #settings label{margin:5px 0;font-size:13px}
  body.touch #settings .mb{font-size:14px;padding:6px 10px;margin:4px 0}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div id="objective"></div>
  <div id="topRight"><div id="clock">12 AM</div><div id="nightLbl">Night 1</div></div>
  <div id="botLeft">
    <div id="powerTxt">Power left: 100%</div>
    <div id="usageTxt">Usage: <span id="bars"></span></div>
    <div id="flashTxt">Lanterna (F): OFF</div>
  </div>
  <div id="stam"><b></b></div>
  <button id="gear" title="Configurações (Esc)">⚙</button>
</div>
<div id="cross"></div>
<div id="prompt"></div>

<div id="monitor">
  <canvas id="noise"></canvas>
  <div class="scan"></div>
  <div class="vig"></div>
  <div id="audioOnly">CÂMERA DESATIVADA<br>SOMENTE ÁUDIO</div>
  <div id="camLabel"></div>
  <div id="rec">● REC</div>
  <div id="map"></div>
  <div id="monHint">Espaço: fechar monitor · ← → trocar câmera</div>
</div>

<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <button class="tb" id="bE">E</button>
  <button class="tb" id="bF">F</button>
  <button class="tb" id="bCam">CAM</button>
  <button class="tb" id="bRun">RUN</button>
</div>
<div id="fade"></div>
<div id="settings"><div class="card">
  <h2>⚙ CONFIGURAÇÕES</h2>
  <label>Sensibilidade do mouse <span id="v_sens"></span><input type="range" id="c_sens" min="0.3" max="3" step="0.05"></label>
  <label>Sensibilidade do toque <span id="v_tsens"></span><input type="range" id="c_tsens" min="0.3" max="3" step="0.05"></label>
  <label>Campo de visão <span id="v_fov"></span><input type="range" id="c_fov" min="55" max="100" step="1"></label>
  <label>Volume <span id="v_vol"></span><input type="range" id="c_vol" min="0" max="1" step="0.05"></label>
  <label>Qualidade gráfica
    <select id="c_res"><option value="0.5">Baixa (mais rápido)</option><option value="0.75">Média</option><option value="1">Alta</option></select></label>
  <label class="chk"><input type="checkbox" id="c_invy"> Inverter eixo Y (olhar)</label>
  <button class="mb main" data-s="close">▶ CONTINUAR</button>
  <button class="mb" data-s="restart" id="s_restart">↻ REINICIAR A NOITE</button>
  <button class="mb" data-s="full">⛶ TELA CHEIA</button>
  <button class="mb" data-s="defaults">RESTAURAR PADRÕES</button>
  <button class="mb" data-s="menu" id="s_menu">☰ MENU PRINCIPAL</button>
  <p class="hint">Esc ou o botão ⚙ abre/fecha este painel.</p>
</div></div>

<div id="rotate">Gire o celular para o modo<br>paisagem (deitado)</div>

<div id="lockHint">PAUSADO<br><span style="font-size:18px">clique para continuar</span></div>
<div id="mpWin"><div class="win"><button class="x" id="mpX" aria-label="Fechar">✕</button><div id="mpBody"></div></div></div>
<div id="helpWin"><div class="win"><button class="x" id="helpX" aria-label="Fechar">✕</button><div id="helpBody"></div></div></div>
<div id="screen"><div class="card"><h1 id="scrTitle"></h1><div id="scrBody"></div><div class="go" id="scrGo">CLIQUE PARA COMEÇAR</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* =====================================================================
   FNaF 1 3D — v2: MAPA + MECÂNICAS + ANDAR LIVRE + LANTERNA + GERADOR
   (animatronics = próxima etapa; ganchos já prontos em `Animatronics`)
   Seções: CONFIG · RENDER · TEXTURAS · MAPA · DECORAÇÃO · ESCRITÓRIO
           GERADOR · CÂMERAS · ÁUDIO · ESTADO · ANIMATRONICS (stub)
           HUD · AÇÕES · ENTRADA · LOOP
   ===================================================================== */

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const Q = new URLSearchParams(location.search);
// celular = tela de toque (use ?touch=1 ou ?touch=0 para forçar)
const mq = s => !!(window.matchMedia && window.matchMedia(s).matches);
const FORCE_INPUT = Q.has('touch');
let TOUCH = Q.has('touch') ? Q.get('touch') !== '0' :
  (mq('(pointer:coarse)') || (typeof navigator !== 'undefined' && navigator.maxTouchPoints > 0 && !mq('(any-pointer:fine)')));
const root = document.body;
const CFG_KEY = 'fnaf3d-livre-cfg';
const CFG_DEF = { sens: 1, tsens: 1, fov: 68, vol: 1, res: 1, invY: false };
const CFG = Object.assign({}, CFG_DEF);
try { Object.assign(CFG, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); } catch (e) {}
function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (e) {} }

/* ===== CONFIG ===== */
const CONFIG = {
  hourSeconds: Q.has('fast') ? 6 : 89,   // ?fast=1 acelera o relógio para testes
  startPower: 100,
  drainBase: 9.6,        // segundos por 1% com uso 1 (divide pelo uso)
  walkSpeed: 2.6,        // m/s
  runSpeed: 4.4,         // m/s (Shift)
  mouseSens: 0.0022,
  touchSens: 0.0055,     // giro ao arrastar o dedo
  reach: 2.8,            // alcance de interação (m)
  genTime: 4.0,          // s segurando E para ligar o gerador
  genRestore: 25,        // % de energia devolvida na 1ª vez (cai 6 a cada uso, mínimo 8)
  wallH: 2.9,
  doorH: 2.1,        // vãos comuns: 1,0 x 2,1 m
  officeDoorH: 2.4, // portas blindadas do escritório
};
const H = CONFIG.wallH;
// portas laterais do escritório: vão em z (mais atrás, longe da mesa) e altura dos botões
const DOOR = { z0: 1.0, z1: 2.0, zc: 1.5, pz: 2.65 };   // portas de 1,0 m, atrás da janela lateral e da mesa
const ODH = CONFIG.officeDoorH;
const DESK_Z = -1.2;   // centro da mesa (perto da janela)

/* ===== RENDER ===== */
const renderer = new THREE.WebGLRenderer({ antialias: !TOUCH });
const basePR = Math.min(window.devicePixelRatio || 1, TOUCH ? 1.5 : 2);
renderer.setPixelRatio(basePR * CFG.res);
renderer.setSize(innerWidth, innerHeight);
$('app').appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.03);

/* ===== TEXTURAS / MATERIAIS ===== */
function tex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
const checker = (a, b) => tex(64, 64, (g, w, h) => {
  g.fillStyle = a; g.fillRect(0, 0, w, h);
  g.fillStyle = b; g.fillRect(0, 0, w / 2, h / 2); g.fillRect(w / 2, h / 2, w / 2, h / 2);
});
const stripes = (a, b, n = 8) => tex(64, 64, (g, w, h) => {
  g.fillStyle = a; g.fillRect(0, 0, w, h);
  g.fillStyle = b;
  for (let i = 0; i < n; i += 2) g.fillRect(i * w / n, 0, w / n, h);
});
// Lanterna: feixe calculado POR PIXEL no shader (o Lambert do three r128 só ilumina por vértice e dava blocos)
const FL = { uFl: { value: 0 }, uFc: { value: new THREE.Vector2(Math.cos(0.95), Math.cos(0.2)) } };
function flashPatch(m) {
  m.extensions = Object.assign(m.extensions || {}, { derivatives: true });
  m.onBeforeCompile = sh => {
    sh.uniforms.uFl = FL.uFl; sh.uniforms.uFc = FL.uFc;
    sh.vertexShader = 'varying vec3 vFV;\n' + sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n vFV = mvPosition.xyz;');
    sh.fragmentShader = 'uniform float uFl; uniform vec2 uFc; varying vec3 vFV;\n' + sh.fragmentShader.replace('#include <envmap_fragment>',
      `#include <envmap_fragment>
      if (uFl > 0.001) {
        vec3 fv = normalize(vFV); float fd = length(vFV);
        vec3 fn = normalize(cross(dFdx(vFV), dFdy(vFV)));
        float nl = max(dot(fn, -fv), 0.0);
        float sp = smoothstep(uFc.x, uFc.y, dot(fv, vec3(0.0, 0.0, -1.0)));
        float at = clamp(1.0 - fd / 24.0, 0.0, 1.0) / (1.0 + 0.05 * fd * fd);
        outgoingLight += diffuseColor.rgb * vec3(1.0, 0.94, 0.8) * uFl * sp * at * (0.3 + 0.7 * nl) * 3.6;
      }`);
  };
  return m;
}
const crtTex = tex(128, 96, (g, w, h) => {
  g.fillStyle = '#12303a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) { const v = 40 + Math.random() * 90; g.fillStyle = 'rgb(' + (v * 0.5 | 0) + ',' + v + ',' + (v * 1.1 | 0) + ')'; g.fillRect(Math.random() * w, Math.random() * h, 2, 1); }
  g.fillStyle = 'rgba(0,0,0,0.35)'; for (let y = 0; y < h; y += 3) g.fillRect(0, y, w, 1);
  g.fillStyle = 'rgba(150,255,220,0.55)'; g.font = 'bold 11px monospace'; g.fillText('CAM 1A', 6, 14);
  g.fillStyle = 'rgba(255,80,80,0.8)'; g.beginPath(); g.arc(w - 10, 10, 3, 0, 7); g.fill();
});
const L = o => flashPatch(new THREE.MeshLambertMaterial(o));
const hazard = tex(64, 64, (g, w, h) => {   // listras amarelas e pretas das portas do escritório
  g.fillStyle = '#d8b020'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#161616';
  for (let i = -h; i < w + h; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 16, 0); g.lineTo(i + 16 + h, h); g.lineTo(i + h, h); g.closePath(); g.fill(); }
});

function scaleUV(geo, su, sv) {
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
  uv.needsUpdate = true;
}
// MeshLambert (three r128) calcula a luz POR VÉRTICE: uma parede de 20 m com 4 vértices fica preta
// se os cantos estão longe das lâmpadas. Malhas finas (a cada SEG metros) resolvem isso.
const SEG = 0.5;
const segs = s => Math.min(60, Math.max(1, Math.ceil(s / SEG)));
function box(cx, cy, cz, sx, sy, sz, mat, uvs) {
  const g = new THREE.BoxGeometry(sx, sy, sz, segs(sx), segs(sy), segs(sz));
  if (uvs) scaleUV(g, uvs[0], uvs[1]);
  const m = new THREE.Mesh(g, mat);
  m.position.set(cx, cy, cz);
  scene.add(m);
  return m;
}
function cyl(x, y, z, rt, rb, h, mat, seg = 12) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}
function plane(w, d, y, x, z, mat, down) {
  const k = down ? 1.0 : SEG;   // teto quase não é visto: malha mais grossa
  const g = new THREE.PlaneGeometry(w, d, Math.min(80, Math.ceil(w / k)), Math.min(80, Math.ceil(d / k)));
  scaleUV(g, w, d);
  const m = new THREE.Mesh(g, mat);
  m.rotation.x = down ? Math.PI / 2 : -Math.PI / 2;
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}
// placa/cartaz com texto (ry = rotação em Y; 0 olha para +z)
function sign(text, w, h, x, y, z, ry = 0, bg = '#e8d9a8', fg = '#222') {
  const px = 256, ph = Math.max(32, Math.round(px * h / w));
  const t = tex(px, ph, (g, cw, ch) => {
    g.fillStyle = bg; g.fillRect(0, 0, cw, ch);
    g.strokeStyle = fg; g.lineWidth = 4; g.strokeRect(2, 2, cw - 4, ch - 4);
    g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
    const lines = text.split('\n');
    const longest = Math.max(...lines.map(l => l.length));
    const fs = Math.floor(Math.min(ch / (lines.length + 0.6), cw / (longest * 0.62)));
    g.font = 'bold ' + fs + 'px Arial';
    lines.forEach((ln, i) => g.fillText(ln, cw / 2, ch * (i + 1) / (lines.length + 1)));
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), L({ map: t }));
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.userData.noOcc = true;   // cartazes colados na parede não bloqueiam a mira
  scene.add(m);
  return m;
}

function glowSign(...a) { const m = sign(...a); m.material = new THREE.MeshBasicMaterial({ map: m.material.map }); return m; }

// Eixos: x = esquerda(-)/direita(+) do escritório · z = frente(-)/trás(+) · y = altura
// O jogador nasce no escritório (z ~ +1.4) olhando para -z (lado do salão).
const ROOMS = {};
function room(name, x1, z1, x2, z2, floorMat, wallMat) {
  const w = x2 - x1, d = z2 - z1, cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
  ROOMS[name] = { name, x1, z1, x2, z2, w, d, cx, cz, wallMat: wallMat || M.wallPlain };
  plane(w, d, 0, cx, cz, floorMat, false);
  plane(w, d, H, cx, cz, M.ceiling, true);
}
const T = 0.2; // espessura das paredes
// axis 'x': parede corre ao longo de x em z=fixed · axis 'z': corre ao longo de z em x=fixed
// gaps: [inicio, fim, alturaDoVão = 2.3, alturaDoPeitoril = 0]
function doorFrame(axis, fixed, a, b, gh) {   // batentes escuros: o vão parece uma porta, não um buraco
  const fm = gh > 2.2 ? M.dark : M.frame, d = T + 0.05, j = 0.1;
  if (axis === 'x') {
    box(a - j / 2, gh / 2, fixed, j, gh, d, fm); box(b + j / 2, gh / 2, fixed, j, gh, d, fm);
    box((a + b) / 2, gh + 0.06, fixed, b - a + 2 * j, 0.12, d, fm);
  } else {
    box(fixed, gh / 2, a - j / 2, d, gh, j, fm); box(fixed, gh / 2, b + j / 2, d, gh, j, fm);
    box(fixed, gh + 0.06, (a + b) / 2, d, 0.12, b - a + 2 * j, fm);
  }
}
function wall(axis, fixed, from, to, gaps, mat) {
  gaps = (gaps || []).slice().sort((p, q) => p[0] - q[0]);
  if (from > to) { const t = from; from = to; to = t; }
  const seg = (a, b, y0, y1) => {
    if (b - a < 0.001 || y1 - y0 < 0.001) return;
    const len = b - a, h = y1 - y0, mid = (a + b) / 2, cy = (y0 + y1) / 2;
    const uvs = [len / 2, h / 2];
    if (axis === 'x') box(mid, cy, fixed, len, h, T, mat, uvs);
    else box(fixed, cy, mid, T, h, len, mat, uvs);
    if (y0 < 1) {  // só trechos que chegam ao chão bloqueiam o jogador
      (axis === 'x' ? solid(a, fixed - T / 2, b, fixed + T / 2) : solid(fixed - T / 2, a, fixed + T / 2, b)).wall = true;
    }
  };
  let cur = from;
  for (const g of gaps) {
    const a = g[0], b = g[1], gh = g[2] === undefined ? CONFIG.doorH : g[2], gy = g[3] || 0;
    seg(cur, a, 0, H);
    seg(a, b, gh, H);
    if (gy === 0 && gh < H - 0.05) doorFrame(axis, fixed, a, b, gh);
    if (gy > 0) seg(a, b, 0, gy);
    cur = b;
  }
  seg(cur, to, 0, H);
}

// Paredes externas: geradas automaticamente em todo lado de sala que NÃO encosta em outra sala.
// (Onde duas salas se encostam, o lado fica aberto, a menos que exista parede interna abaixo.)
const EXTRA_GAPS = [{ axis: 'x', fixed: -37.4, a: 0.7, b: 3.7, h: 2.4 }];   // entrada larga do saguão
function autoWalls() {
  const rs = Object.values(ROOMS), eq = (a, b) => Math.abs(a - b) < 1e-6;
  // trechos de [a,b] que nenhum dos intervalos 'covers' cobre
  const free = (a, b, covers) => {
    let segs = [[a, b]];
    covers.forEach(c => {
      const out = [];
      segs.forEach(s => {
        if (c[1] <= s[0] || c[0] >= s[1]) out.push(s);
        else { if (c[0] > s[0]) out.push([s[0], c[0]]); if (c[1] < s[1]) out.push([c[1], s[1]]); }
      });
      segs = out;
    });
    return segs.filter(s => s[1] - s[0] > 1e-6);
  };
  rs.forEach(r => {
    const others = rs.filter(o => o !== r);
    [['x', r.z1, r.x1, r.x2, o => eq(o.z2, r.z1), o => [o.x1, o.x2]],   // lado norte
     ['x', r.z2, r.x1, r.x2, o => eq(o.z1, r.z2), o => [o.x1, o.x2]],   // lado sul
     ['z', r.x1, r.z1, r.z2, o => eq(o.x2, r.x1), o => [o.z1, o.z2]],   // lado oeste
     ['z', r.x2, r.z1, r.z2, o => eq(o.x1, r.x2), o => [o.z1, o.z2]]    // lado leste
    ].forEach(e => {
      free(e[2], e[3], others.filter(e[4]).map(e[5])).forEach(s => wall(e[0], e[1], s[0], s[1],
        EXTRA_GAPS.filter(g => g.axis === e[0] && Math.abs(g.fixed - e[1]) < 1e-6 && g.a >= s[0] - 1e-6 && g.b <= s[1] + 1e-6).map(g => g.h ? [g.a, g.b, g.h] : [g.a, g.b]), r.wallMat));
    });
  });
}

function chair(x, z, mat) { box(x, 0.25, z, 0.42, 0.5, 0.42, mat); }
function longTable(x, z, len, alongZ) {   // alongZ = comprimento no eixo z
  const wid = 1.3, n = Math.floor(len / 0.62);
  if (alongZ) {
    box(x, 0.78, z, wid, 0.08, len, M.tableTop);
    box(x, 0.39, z - len / 2 + 0.3, wid - 0.3, 0.7, 0.1, M.metal);
    box(x, 0.39, z + len / 2 - 0.3, wid - 0.3, 0.7, 0.1, M.metal);
    for (let i = 0; i < n; i++) {
      const cz = z - (n - 1) * 0.31 + i * 0.62, m = i % 2 ? M.chairB : M.chairR;
      chair(x - 1.0, cz, m); chair(x + 1.0, cz, m);
    }
    solid(x - 1.35, z - len / 2 - 0.1, x + 1.35, z + len / 2 + 0.1);
  } else {
    box(x, 0.78, z, len, 0.08, wid, M.tableTop);
    box(x - len / 2 + 0.3, 0.39, z, 0.1, 0.7, wid - 0.3, M.metal);
    box(x + len / 2 - 0.3, 0.39, z, 0.1, 0.7, wid - 0.3, M.metal);
    for (let i = 0; i < n; i++) {
      const cx = x - (n - 1) * 0.31 + i * 0.62, m = i % 2 ? M.chairB : M.chairR;

  });
}
function resetBatteries() {
  batteries.forEach(b => {
    b.taken = false; b.m.visible = true; b.cap.visible = true;
    if (clickables.indexOf(b.m) < 0) clickables.push(b.m);
  });
}
resetBatteries();
function takeBattery(idx, who) {   // who = id do convidado (só no host)
  const b = batteries[idx];
  if (!b || b.taken) return;
  if (MP.role === 'guest') { mpSendHost({ t: 'act', k: 'batt', idx }); return; }
  if (who) { mpSendTo(who, { t: 'evt', k: 'battgot', idx }); b.taken = true; b.m.visible = false; b.cap.visible = false; const j = clickables.indexOf(b.m); if (j >= 0) clickables.splice(j, 1); mpEmit('battgone', { idx }); return; }
  mpEmit('battgone', { idx });
  b.taken = true; b.m.visible = false; b.cap.visible = false;
  const i = clickables.indexOf(b.m); if (i >= 0) clickables.splice(i, 1);
  G.bat = Math.min(100, G.bat + 45);
  Snd.click(); Snd.blip();
  toast('Pilha coletada! Lanterna: ' + Math.round(G.bat) + '%');
  updateHud();
}

/* ===== ÁUDIO (sintetizado, sem arquivos) ===== */
const Snd = (() => {
  let ctx = null, hum = null, buzz = null, master = null;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ctx.createGain(); master.gain.value = CFG.vol; master.connect(ctx.destination);
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 48;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 160;
    const g = ctx.createGain(); g.gain.value = 0;
    o.connect(f); f.connect(g); g.connect(master); o.start(); hum = g;
    const b = ctx.createOscillator(); b.type = 'square'; b.frequency.value = 100;
    const bg = ctx.createGain(); bg.gain.value = 0;
    b.connect(bg); bg.connect(master); b.start(); buzz = bg;
  }
  function burst(dur, vol, freq) {
    if (!ctx) return;
    const n = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ctx.createBufferSource(); s.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  function beep(freq, dur, vol, type) {
    if (!ctx) return;
    const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.value = freq;
    const g = ctx.createGain(); g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime + dur);
  }
  return {
    init,
    setVol(v) { if (master) master.gain.value = v; },
    setHum(v)  { if (hum)  hum.gain.value = v; },
    setBuzz(v) { if (buzz) buzz.gain.value = v; },
    door()  { burst(0.28, 0.55, 380); },
    blip()  { beep(880, 0.08, 0.05, 'square'); },
    click() { beep(1500, 0.04, 0.05, 'square'); },
    sputter() { burst(0.2, 0.35, 520); beep(70 + Math.random() * 30, 0.2, 0.08, 'sawtooth'); },
    genOn() { beep(90, 0.9, 0.12, 'sawtooth'); burst(0.5, 0.4, 300); },
    blackout() { burst(0.6, 0.5, 200); beep(55, 0.8, 0.12, 'sawtooth'); },
    chime() { beep(660, 0.5, 0.08); setTimeout(() => beep(880, 0.6, 0.08), 250); setTimeout(() => beep(1100, 0.9, 0.08), 520); },
    fail()  { burst(0.9, 0.6, 700); },
    step(v) { burst(0.07, v, 170); },
    roar()  { burst(0.9, 0.5, 900); beep(110, 0.8, 0.1, 'sawtooth'); },
    bang()  { burst(0.35, 0.8, 320); beep(60, 0.3, 0.15, 'square'); },
    scare() { burst(1.2, 0.9, 2400); beep(190, 1.1, 0.2, 'sawtooth'); },
    lock()  { beep(200, 0.15, 0.08, 'square'); },
    honk()  { beep(310, 0.14, 0.2, 'square'); setTimeout(() => beep(400, 0.22, 0.2, 'square'), 110); },
  };
})();

/* ===== ANIMATRONICS: robôs originais com IA própria =====
   Barão (cartola)  · só anda quando você NÃO olha para ele (câmera conta). No blecaute ele vem sempre.
   Zig   (azul)     · segue você; a LANTERNA o atrai (anda mais rápido). Vigia a porta ESQUERDA do escritório.
   Pipoca (rosa)    · segue você; barulho (correr, gerador) a deixa rápida. Vigia a porta DIREITA.
   Rex   (cão)      · mora no Pirate Cove; fica mais agressivo com o tempo (vigie a CAM 1C!) e então CORRE até você.
                      Bateu numa porta fechada → perde energia, volta ao cove e reinicia.
   Os três primeiros andam atrás de você (seguem). Porta fechada = eles esperam e desistem. */
const NAV = (() => {
  const C = 0.25, X0 = -17, Z0 = -38, NX = 140, NZ = 172;
  const free = new Uint8Array(NX * NZ), seeOk = new Uint8Array(NX * NZ);
  const rooms = Object.values(ROOMS);
  const inRoom = (x, z) => { for (const r of rooms) if (x >= r.x1 - 0.01 && x <= r.x2 + 0.01 && z >= r.z1 - 0.01 && z <= r.z2 + 0.01) return true; return false; };
  const near = c => c.x2 > X0 - 1 && c.x1 < X0 + NX * C + 1 && c.z2 > Z0 - 1 && c.z1 < Z0 + NZ * C + 1;
  const cols = COL.filter(c => !c.noNav && near(c)), walls = COL.filter(c => c.wall && near(c));
  for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
    const x = X0 + (i + 0.5) * C, z = Z0 + (j + 0.5) * C, ir = inRoom(x, z);
    let ok = ir, see = ir;
    if (ok) for (const c of cols) if (x + 0.2 > c.x1 && x - 0.2 < c.x2 && z + 0.2 > c.z1 && z - 0.2 < c.z2) { ok = false; break; }
    if (see) for (const c of walls) if (x + 0.03 > c.x1 && x - 0.03 < c.x2 && z + 0.03 > c.z1 && z - 0.03 < c.z2) { see = false; break; }
    free[j * NX + i] = ok ? 1 : 0; seeOk[j * NX + i] = see ? 1 : 0;
  }
  const ci = x => Math.floor((x - X0) / C), cj = z => Math.floor((z - Z0) / C);
  const inb = (i, j) => i >= 0 && j >= 0 && i < NX && j < NZ;
  const ctr = idx => [X0 + ((idx % NX) + 0.5) * C, Z0 + (((idx / NX) | 0) + 0.5) * C];
  function nearest(x, z) {
    const i0 = ci(x), j0 = cj(z);
    for (let r = 0; r < 14; r++) {
      let best = -1, bd = 1e9;
      for (let j = j0 - r; j <= j0 + r; j++) for (let i = i0 - r; i <= i0 + r; i++) {
        if (Math.max(Math.abs(i - i0), Math.abs(j - j0)) !== r || !inb(i, j) || !free[j * NX + i]) continue;
        const d = (i - i0) * (i - i0) + (j - j0) * (j - j0);
        if (d < bd) { bd = d; best = j * NX + i; }
      }
      if (best >= 0) return best;
    }
    return -1;
  }
  const DI = [1, -1, 0, 0, 1, 1, -1, -1], DJ = [0, 0, 1, -1, 1, -1, 1, -1];
  const queue = new Int32Array(NX * NZ);
  function field(gx, gz) {   // distância (em células) de cada célula até o alvo; -1 = inalcançável
    const d = new Int16Array(NX * NZ).fill(-1), s = nearest(gx, gz);
    if (s < 0) return d;
    let h = 0, t = 0; d[s] = 0; queue[t++] = s;
    while (h < t) {
      const c = queue[h++], i = c % NX, j = (c / NX) | 0, dc = d[c];
      for (let k = 0; k < 8; k++) {
        const ni = i + DI[k], nj = j + DJ[k];
        if (!inb(ni, nj)) continue;
        const n = nj * NX + ni;
        if (!free[n] || d[n] >= 0) continue;
        if (k >= 4 && (!free[j * NX + ni] || !free[nj * NX + i])) continue;   // sem cortar quina
        d[n] = dc + 1; queue[t++] = n;
      }
    }
    return d;
  }
  function next(d, x, z) {   // centro da melhor célula vizinha (ou null se já chegou)
    const i0 = ci(x), j0 = cj(z), idx = j0 * NX + i0;
    if (!inb(i0, j0) || !free[idx]) { const n = nearest(x, z); return n < 0 ? null : ctr(n); }
    let bd = d[idx], best = -1;
    if (bd < 0) return null;
    for (let k = 0; k < 8; k++) {
      const ni = i0 + DI[k], nj = j0 + DJ[k];
      if (!inb(ni, nj) || !free[nj * NX + ni]) continue;
      if (k >= 4 && (!free[j0 * NX + ni] || !free[nj * NX + i0])) continue;
      const dd = d[nj * NX + ni];
      if (dd >= 0 && dd < bd) { bd = dd; best = nj * NX + ni; }
    }
    return best < 0 ? null : ctr(best);
  }
  function crossDoor(ax, az, bx, bz) {   // porta do escritório entre os dois pontos?
    for (const s of ['L', 'R']) {
      const dx = s === 'L' ? -2 : 2;
      if ((ax - dx) * (bx - dx) < 0) {
        const z = az + (bz - az) * ((dx - ax) / (bx - ax));
        if (z > DOOR.z0 - 0.05 && z < DOOR.z1 + 0.05) return s;
      }
    }
    return null;
  }
  function see(ax, az, bx, bz) {   // linha de visão (paredes e porta fechada bloqueiam; móveis baixos não)
    const dx = bx - ax, dz = bz - az, n = Math.ceil(Math.hypot(dx, dz) / 0.2);
    for (let k = 1; k < n; k++) {
      const x = ax + dx * k / n, z = az + dz * k / n, i = ci(x), j = cj(z);
      if (!inb(i, j) || !seeOk[j * NX + i]) return false;
    }
    const s = crossDoor(ax, az, bx, bz);
    return !(s && doors[s].p < 0.9);
  }
  return { field, next, see, crossDoor, free, ci, cj, NX, NZ, isFree: (x, z) => { const i = ci(x), j = cj(z); return inb(i, j) && free[j * NX + i] === 1; } };
})();

  // vários jogadores (multiplayer): cada robô persegue o jogador vivo mais próximo. Para reaproveitar a IA de um jogador só,
  // trocamos temporariamente P/G.monitor/G.cam/G.flash pelos dados do alvo enquanto o robô é atualizado.
  const HOSTF = { id: 'host', host: true };
  const pfc = {};
  let FOC = [HOSTF], curT = HOSTF, RP = P;
  function foci() {
    if (MP.role !== 'host') return [HOSTF];
    const out = [];
    if (!G.dead && G.loc === 'in') out.push(HOSTF);
    for (const id in MP.players) { const q = MP.players[id]; if (q.alive && q.loc === 'in') out.push(q); }
    return out;
  }
  function withFocus(f, fn) {
    if (f.host) return fn();
    const s = [P.x, P.z, P.yaw, P.pitch, P.eye, G.monitor, G.cam, G.flash, G.sprinting];
    P.x = f.x; P.z = f.z; P.yaw = f.yaw || 0; P.pitch = f.pitch || 0; P.eye = f.eye || 1.6;
    G.monitor = !!f.monitor; G.cam = f.cam || '1A'; G.flash = !!f.flash; G.sprinting = !!f.sprint;
    try { return fn(); } finally { P.x = s[0]; P.z = s[1]; P.yaw = s[2]; P.pitch = s[3]; P.eye = s[4]; G.monitor = s[5]; G.cam = s[6]; G.flash = s[7]; G.sprinting = s[8]; }
  }
  const seenByAny = b => FOC.some(f => withFocus(f, () => seenByPlayer(b)));
  const litByAny = b => FOC.some(f => withFocus(f, () => lit(b)));
  const flashAny = () => FOC.some(f => withFocus(f, () => G.flash && !G.monitor));
  const watching1C = () => FOC.some(f => withFocus(f, () => G.monitor && G.cam === '1C'));

  const act = id => ({ zig: Math.max(8, 110 - 22 * (G.night - 1)), pipoca: Math.max(20, 200 - 38 * (G.night - 1)), baron: Math.max(40, 300 - 55 * (G.night - 1)) })[id];
  const dist = b => Math.hypot(b.x - P.x, b.z - P.z);
  const roomOf = (x, z) => { for (const k in ROOMS) { const r = ROOMS[k]; if (x > r.x1 && x < r.x2 && z > r.z1 && z < r.z2) return k; } return null; };
  const onStage = b => b.x > -4 && b.x < 4 && b.z < -24.8 && b.z > -30;
  const tickBase = () => Math.max(7, 17 - 1.6 * (G.night - 1));
  // Rex: só começa a se agitar por volta das 2 AM na noite 1 (mais cedo nas próximas) e cada etapa demora bem mais
  const rexTick = () => tickBase() * 2.4;
  const rexStart = () => CONFIG.hourSeconds * Math.max(0.5, 1.8 - 0.3 * (G.night - 1));

  function seenByPlayer(b) {
    if (G.monitor) return roomOf(b.x, b.z) === G.cam;
    const dx = b.x - P.x, dz = b.z - P.z, dy = 1.2 - P.eye, L = Math.hypot(dx, dy, dz);
    if (L > 28) return false;
    if (L < 0.4) return true;
    const cp = Math.cos(P.pitch), fx = -Math.sin(P.yaw) * cp, fy = Math.sin(P.pitch), fz = -Math.cos(P.yaw) * cp;
    return (dx * fx + dy * fy + dz * fz) / L > 0.74 && NAV.see(P.x, P.z, b.x, b.z);
  }
  function lit(b) {   // lanterna apontada para o robô?
    if (!G.flash || G.monitor) return false;
    const dx = b.x - P.x, dz = b.z - P.z, dy = 1.2 - P.eye, L = Math.hypot(dx, dy, dz);
    if (L > 10) return false;
    const cp = Math.cos(P.pitch), fx = -Math.sin(P.yaw) * cp, fy = Math.sin(P.pitch), fz = -Math.cos(P.yaw) * cp;
    return (dx * fx + dy * fy + dz * fz) / L > 0.95 && NAV.see(P.x, P.z, b.x, b.z);
  }
  function place(b) {
    const ty = onStage(b) ? 0.6 : (Math.abs(b.x) < 1.3 && b.z > -24.8 && b.z < -24.2 ? 0.3 : 0);
    b.y += (ty - b.y) * 0.4;
    b.g.position.set(b.x, b.y, b.z);
    b.g.rotation.y = b.face;
    const u = b.g.userData, sw = b.moving ? Math.sin(b.ph) * 0.65 : 0;
    if (u.legL) { u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.armL.rotation.x = -sw; u.armR.rotation.x = sw; }
  }
  function turn(b, f, dt) {
    let d = f - b.face;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    b.face += d * Math.min(1, dt * 9);
  }
  // anda um passo pelo campo de distância. Retorna 'ok' | 'arrived' | 'door:L' | 'door:R'
  function step(b, fld, speed, dt) {
    b.moving = false;
    if (!fld || speed <= 0) return 'arrived';
    const t = NAV.next(fld, b.x, b.z);
    if (!t) return 'arrived';
    const dx = t[0] - b.x, dz = t[1] - b.z, L = Math.hypot(dx, dz);
    if (L < 1e-4) return 'ok';
    const s = Math.min(L, speed * dt), nx = b.x + dx / L * s, nz = b.z + dz / L * s;
    const side = NAV.crossDoor(b.x, b.z, nx, nz);
    if (side && doors[side].p < 0.9) return 'door:' + side;
    b.x = nx; b.z = nz; b.moving = true;
    turn(b, Math.atan2(dx, dz), dt);
    b.ph += dt * (b.id === 'rex' ? 15 : 7);
    return 'ok';
  }
  function sound(b, dt) {
    if (!b.moving) return;
    b.stepT -= dt;
    if (b.stepT > 0) return;
    b.stepT = b.id === 'rex' ? 0.26 : 0.6;
    const d = Math.hypot(b.x - RP.x, b.z - RP.z);   // volume pela distância até VOCÊ (não até o alvo do robô)
    if (d < 24) Snd.step(Math.min(0.2, 0.5 / (1 + d * 0.6)));
  }

  /* ---- susto ---- */
  function caughtRemote(f, b) {   // multiplayer: o robô pegou outro jogador
    f.alive = false; f.use = null;
    mpSendTo(f.id, { t: 'evt', k: 'scare', bot: b.id });
    if (b.id === 'rex') rexToCove(b, 1.0);
    else { b.mode = 'retreat'; b.t = rnd(14, 22); b.rf = retreatField(true); b.enter = false; b.side = null; }
    mpCheckAllDead(b.name);
  }
  function scare(b, f) {
    if (f && !f.host) { caughtRemote(f, b); return; }
    if (G.state !== 'playing') return;
    G.state = 'scare'; G.scare = { b, t: 0 };
    closeMonitorSilent(); G.use = null; G.flash = false; G.genProg = 0;
    $('prompt').style.display = 'none'; $('cross').style.display = 'none';
    b.g.visible = true;
    Snd.setHum(0); Snd.setBuzz(0); Snd.scare();
  }
  function updateScare(dt) {
    const s = G.scare;
    if (!s) return;
    const b = s.b;
    s.t += dt;
    const dx = b.x - P.x, dz = b.z - P.z, L = Math.hypot(dx, dz) || 1;
    const tx = P.x + dx / L * 0.85, tz = P.z + dz / L * 0.85;
    b.x += (tx - b.x) * Math.min(1, dt * 12); b.z += (tz - b.z) * Math.min(1, dt * 12);
    b.face = Math.atan2(-dx, -dz); b.y = 0; b.moving = false;
    P.yaw = Math.atan2(-dx, -dz);
    P.pitch = b.id === 'rex' ? -0.18 : 0.3;
    const k = (b.id === 'rex' ? 1.7 : 1.05) * (1 + s.t * 0.25);
    b.g.scale.set(k, k, k);
    G.shake = 1;
    place(b);
    if (s.t > 1.4) {
      b.g.scale.set(1, 1, 1); G.scare = null;
      if (s.remote) {   // convidado: o host decidiu que fui pego
        if (G.pendingOver) lose(G.pendingOver);
        else { G.state = 'playing'; G.dead = true; MP.specId = null; toast('Você foi pego! Acompanhe seus amigos'); G.toastT = 5; updateHud(); }
      } else if (MP.role === 'host' && mpAliveRemotes() > 0) {   // host pego, mas ainda há jogadores vivos
        G.state = 'playing'; G.dead = true; MP.specId = null; G.flash = false;
        if (b.id === 'rex') rexToCove(b, 1.0); else { b.mode = 'retreat'; b.t = rnd(14, 22); b.rf = retreatField(true); b.enter = false; b.side = null; }
        toast('Você foi pego! Acompanhe seus amigos'); G.toastT = 5; updateHud();
      } else lose(b.name + ' te pegou!');
    }
  }

  /* ---- Rex ---- */
  function placeRex(b) {
    b.x = REX_X[b.rage]; b.z = -11.5; b.face = Math.PI / 2; b.moving = false;
    b.g.scale.set(1, b.rage === 0 ? 0.82 : 1, 1);
  }
  function rexToCove(b, mult) {
    b.mode = 'cove'; b.rage = 0; b.t = rnd(rexTick() * 1.1, rexTick() * 1.7) * (mult || 1); placeRex(b);
  }
  function bang(b) {
    const cost = 1 + 2 * b.bangs;
    G.power = Math.max(0, G.power - cost); b.bangs++;
    Snd.bang(); G.shake = 0.7;
    toast('Rex bateu na porta! -' + cost + '% de energia');
    mpEmit('bang', { msg: 'Rex bateu na porta! -' + cost + '% de energia' });
    rexToCove(b, 1.3);
  }
  function updRex(b, dt) {
    if (b.mode === 'cove') {
      if (G.t < rexStart() || G.powerOut) return;
      b.t -= dt;
      if (b.t <= 0) {
        if (watching1C()) { b.t = rnd(2.5, 4.5); return; }   // você está vigiando: ele espera
        if (b.rage < 3) { b.rage++; b.t = rnd(rexTick() * 0.7, rexTick() * 1.3); placeRex(b); }
        else { b.mode = 'warn'; b.t = 1.6; Snd.roar(); toast('REX está correndo! Feche a porta ou fuja!'); G.toastT = 2.6; mpEmit('roar', { msg: 'REX está correndo! Feche a porta ou fuja!' }); }
      }
    } else if (b.mode === 'warn') {
      b.t -= dt; b.g.position.x = b.x + (Math.random() - 0.5) * 0.06;
      if (b.t <= 0) b.mode = 'run';
    } else if (b.mode === 'run') {
      let sp = Math.min(5.6, 4.7 + 0.18 * G.night);
      if (litByAny(b)) sp *= 0.5;   // lanterna apontada para o Rex: ele fica mais lento
      const r = step(b, pf, sp, dt);
      sound(b, dt);
      if (r.indexOf('door') === 0) { bang(b); return; }
      if (dist(b) < 0.95 && NAV.see(b.x, b.z, P.x, P.z)) scare(b, curT);
    }
  }

  /* ---- Barão, Zig e Pipoca (seguidores) ---- */
  function updFollower(b, dt) {
    const id = b.id, base = DEF[id].base * (0.92 + 0.08 * G.night);
    if (b.mode === 'idle') {
      if (G.t >= act(id)) b.mode = 'follow';
      else { b.moving = false; return; }
    }
    const hunting = id === 'baron' && G.powerOut;
    let sp = base;
    if (id === 'pipoca' && noise > 0) sp = base * 1.9;
    if (id === 'zig' && flashAny()) sp = base * 1.6;   // Zig é atraído pela luz da lanterna
    if (hunting) sp = 2.1;

    if (b.mode === 'retreat') {
      b.t -= dt;
      step(b, b.rf, base * 1.15, dt);
      if (b.t <= 0) { b.mode = 'follow'; b.enter = false; }
      sound(b, dt); return;
    }
    if (id === 'baron' && !hunting && seenByAny(b)) { b.moving = false; return; }   // congela enquanto olham

    const inOff = inOffice();
    if (b.mode === 'door') {
      b.moving = false;
      if (!inOff || hunting) { b.mode = 'follow'; b.enter = false; return; }
      const d = doors[b.side];
      if (d.p >= 0.95) {
        b.ct = 0;
        b.hes -= dt;
        if (b.hes <= 0) { b.mode = 'follow'; b.enter = true; }
      } else {
        b.hes = rnd(1.2, 2.4);
        if (!b.ct) b.ct = rnd(1.6, 3.2);   // viu a porta fechada: desiste em poucos segundos
        b.ct -= dt;
        if (b.ct <= 0) { b.ct = 0; b.mode = 'retreat'; b.t = rnd(20, 30) - 2 * G.night; b.rf = retreatField(true); b.enter = false; }
      }
      return;
    }
    // mode follow
    let fld = pf;
    if (inOff && !hunting && !b.enter) {
      if (!b.side) b.side = id === 'zig' ? 'L' : id === 'pipoca' ? 'R' : (Math.random() < 0.5 ? 'L' : 'R');
      const sp2 = SPOT[b.side];
      if (Math.hypot(b.x - sp2[0], b.z - sp2[1]) < 0.7) { b.mode = 'door'; b.t = rnd(5, 9); b.ct = 0; b.hes = rnd(1.2, 2.4); b.moving = false; return; }
      fld = fieldAt('d' + b.side, sp2[0], sp2[1]);
    }
    const r = step(b, fld, sp, dt);
    sound(b, dt);
    if (r.indexOf('door') === 0) { b.side = r.slice(5); b.mode = 'door'; b.enter = false; b.t = rnd(4, 7); b.hes = rnd(1.2, 2.4); return; }
    if (dist(b) < 0.95 && NAV.see(b.x, b.z, P.x, P.z)) scare(b, curT);
  }

  return {
    list, bots, NAV,
    init() {},
    reset() {
      list.forEach(b => {
        const h = DEF[b.id].home;
        b.x = h[0]; b.z = h[1]; b.face = h[2]; b.y = onStage(b) ? 0.6 : 0;
        b.mode = b.id === 'rex' ? 'cove' : 'idle';
        b.t = 0; b.side = null; b.enter = false; b.hes = 0; b.moving = false; b.rage = 0; b.bangs = 0; b.ph = 0;
        b.g.visible = true; b.g.scale.set(1, 1, 1);
        if (b.id === 'rex') { b.t = rnd(rexTick() * 0.8, rexTick() * 1.4); placeRex(b); }
        place(b);
      });
      pf = null; pfT = 0; noise = 0; G.scare = null; for (const k in pfc) delete pfc[k]; FOC = [HOSTF];
    },
    update(dt) {
      noise = Math.max(0, noise - dt);
      if (G.sprinting) noise = Math.max(noise, 0.3);
      RP = { x: P.x, z: P.z };
      FOC = foci();
      for (const f of FOC) if (!f.host && f.sprint) noise = Math.max(noise, 0.3);
      for (const f of FOC) {   // campo de navegação de cada alvo (renovado a cada ~0,3 s)
        const e = pfc[f.id] || (pfc[f.id] = { f: null, t: Math.random() * 0.3 });
        e.t -= dt;
        if (!e.f || e.t <= 0) { const x = f.host ? P.x : f.x, z = f.host ? P.z : f.z; e.f = NAV.field(x, z); e.t = 0.3; }
      }
      for (const b of list) {
        if (G.state !== 'playing') break;
        if (b.mode === 'off') continue;
        b.moving = false;
        if (!FOC.length) continue;
        let T = FOC[0], bd = Infinity;
        for (const f of FOC) { const x = f.host ? P.x : f.x, z = f.host ? P.z : f.z, d = Math.hypot(b.x - x, b.z - z); if (d < bd) { bd = d; T = f; } }
        curT = T; pf = pfc[T.id].f;
        withFocus(T, () => { if (b.id === 'rex') updRex(b, dt); else updFollower(b, dt); });
      }
      list.forEach(place);
    },
    updateScare,
    remoteOpen: null,
    rexOpen() { if (this.remoteOpen !== null) return this.remoteOpen; const b = bots.rex; if (!b || b.mode === 'off') return 0; if (b.mode === 'warn' || b.mode === 'run') return 1; return [0, 0.25, 0.55, 0.85][b.rage] || 0; },
    // convidado: aplica o estado dos robôs recebido do host
    applyRemote(arr, dt) {
      list.forEach((b, i) => {
        const a = arr[i]; if (!a) return;
        if (!(G.scare && G.scare.b === b)) { b.x = a[0]; b.z = a[1]; b.face = a[2]; b.y = a[3]; }
        b.moving = !!a[4]; b.g.visible = !!a[5]; b.mode = a[5] ? 'on' : 'off';
        if (!(G.scare && G.scare.b === b)) b.g.scale.set(1, a[6], 1);
        if (b.moving) { b.ph += dt * (b.id === 'rex' ? 15 : 7); b.stepT -= dt; if (b.stepT <= 0 && b.g.visible) { b.stepT = b.id === 'rex' ? 0.26 : 0.6; const d = Math.hypot(b.x - P.x, b.z - P.z); if (d < 24) Snd.step(Math.min(0.2, 0.5 / (1 + d * 0.6))); } }
        place(b);
      });
    },
    scareRemote(id) {
      const b = bots[id];
      if (!b || G.state !== 'playing') return;
      G.state = 'scare'; G.scare = { b, t: 0, remote: true };
      closeMonitorSilent(); G.use = null; G.flash = false; G.genProg = 0;
      $('prompt').style.display = 'none'; $('cross').style.display = 'none';
      b.g.visible = true;
      Snd.setHum(0); Snd.setBuzz(0); Snd.scare();
    },
    dawn() { list.forEach(b => { b.mode = 'off'; b.g.visible = false; b.moving = false; }); },
    onPowerOut() {
      const b = bots.baron;
      if (b.mode === 'idle' || b.mode === 'retreat' || b.mode === 'door') { b.mode = 'follow'; b.enter = true; }
    },
    onGeneratorNoise(dt) { noise = Math.max(noise, 0.6); },
    onPowerRestore(uses) {
      const b = bots.baron;
      if (b.mode === 'off') return;
      b.mode = 'retreat'; b.t = rnd(10, 14); b.rf = homeField('baron'); b.enter = false;
    },
    onMonitorChange(open) {},
    onDoorChange(side, closed) {},
  };
})();

/* ===== HUD ===== */
const barsEl = $('bars');
for (let i = 0; i < 5; i++) barsEl.appendChild(document.createElement('i'));
function updateHud() {
  $('powerTxt').textContent = 'Power left: ' + Math.floor(G.power) + '%';
  const u = clamp(G.usage, 0, 5);
  [...barsEl.children].forEach((el, i) => {
    el.className = i < u ? 'on ' + (i < 2 ? 'g' : i < 4 ? 'y' : 'r') : '';
  });
  $('clock').textContent = HOURS[Math.min(G.hour, 6)];
  $('nightLbl').textContent = 'Night ' + G.night;
  $('flashTxt').textContent = 'Lanterna (F): ' + (G.flash ? 'ON' : 'OFF') + ' · Bateria ' + Math.round(G.bat) + '%';
  const st = $('stam');
  st.style.display = (G.stamina < 99.5 || G.sprinting) ? 'block' : 'none';
  st.firstChild.style.width = clamp(G.stamina, 0, 100) + '%';
  st.classList.toggle('tired', G.tired);
  const ob = $('objective');
  let o = '';
  if (G.dead) o = 'VOCÊ FOI PEGO — assistindo ' + mpInfo(MP.specId || '').name + ' (clique ou toque em E para trocar)';
  else if (G.dawn) o = G.loc === 'in' ? '6 AM! Turno encerrado. Vá até as PORTAS DO SAGUÃO (saída) e volte para o carro' : 'Vá até o seu CARRO (E) e volte para casa';
  else if (G.arrive) o = G.loc === 'out' ? 'Entre na pizzaria: clique (E) nas portas de vidro da entrada' : 'Sem energia! Vá ao GERADOR (Parts & Service, câmera 5) e segure E · F = lanterna';
  else if (G.powerOut) o = 'SEM ENERGIA — vá até o GERADOR (sala Parts & Service, câmera 5) e segure E · F = lanterna';
  ob.textContent = o;
  ob.style.display = o ? 'block' : 'none';
}

/* ===== POINTER LOCK ===== */
const lockAPI = !!canvas.requestPointerLock;
let lockSupported = !TOUCH && lockAPI;
// celular com mouse: ao detectar um mouse de verdade, liga o pointer lock (toque continua funcionando)
let lockFail = false;
let lastTouchT = 0;
// detecção automática: mouse/teclado de verdade -> modo PC; toque na tela -> modo celular
function setInputMode(touch, mouse) {
  if (FORCE_INPUT) return;
  if (!touch && mouse && lockAPI && !lockSupported) {
    lockSupported = true; lockFail = false;
    if (G.state === 'playing' && !G.monitor && !G.cfg) lock();
  }
  if (touch === TOUCH) return;
  TOUCH = touch;
  root.classList.toggle('touch', touch);
  if (G.state === 'playing') $('touch').style.display = touch ? 'block' : 'none';
  if (touch) { lockSupported = false; lockFail = false; if (isLocked()) unlock(); }
  else { endJoy(); lookId = null; }
  if ($('helpWin').style.display === 'flex') $('helpBody').innerHTML = helpHtml();
}
addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && performance.now() - lastTouchT > 900) setInputMode(false, true);
}, true);
addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' && e.movementX * e.movementX + e.movementY * e.movementY > 0 && performance.now() - lastTouchT > 900) setInputMode(false, true);
}, true);
addEventListener('touchstart', () => { lastTouchT = performance.now(); setInputMode(true, false); }, { capture: true, passive: true });
addEventListener('keydown', e => {
  if (/^(Key[WASDEF]|Arrow\w+|Space|Shift\w+)$/.test(e.code)) setInputMode(false, false);
}, true);
const isLocked = () => document.pointerLockElement === canvas;
function lock() {
  if (!lockSupported) return;
  try { canvas.requestPointerLock(); } catch (e) {}
}
function unlock() {
  if (document.exitPointerLock) document.exitPointerLock();
}
const isPaused = () => G.cfg || G.state === 'playing' && lockSupported && !lockFail && !G.monitor && !isLocked();
$('lockHint').addEventListener('click', () => {
  lock();

/* ===== MONITOR ===== */
function syncMonitorUI() {
  $('monitor').classList.toggle('on', G.monitor);
  root.classList.toggle('mon', G.monitor);
  if (G.monitor && TOUCH) endJoy();
  canvas.style.filter = G.monitor ? 'grayscale(.8) contrast(1.15) brightness(1.15)' : 'none';
  scene.fog.density = G.monitor ? 0.012 : 0.03;
}
function toggleMonitor() {
  if (G.state !== 'playing' || G.powerOut || G.dead) return;
  const now = performance.now();
  if (now - G.camCool < 350) return;
  if (!G.monitor && !inOffice()) { toast('Volte ao escritório para usar as câmeras'); return; }
  G.camCool = now;
  G.monitor = !G.monitor;
  G.use = null;
  if (G.monitor) { selectCam(G.cam); unlock(); }
  else lock();
  syncMonitorUI();
  Snd.blip();
  Animatronics.onMonitorChange(G.monitor);
}
function closeMonitorSilent() {
  G.monitor = false;
  syncMonitorUI();
}

/* ---- progresso salvo ---- */
const SAVE_KEY = 'fnaf3d-livre-save';
function loadGame() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    if (s.night > 0) G.night = Math.min(99, s.night | 0);
    G.best = Math.max(G.night, s.best | 0, 1);
  } catch (e) { G.best = Math.max(G.night, 1); }
}
function saveGame() {
  G.best = Math.max(G.best || 1, G.night);
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ night: G.night, best: G.best })); } catch (e) {}
}

/* ---- transição (teleporte com fade) ---- */
function transition(msg, mid) {
  if (G.busy) return;
  G.busy = true; G.use = null; G.genProg = 0;
  const f = $('fade');
  f.textContent = msg || '';
  f.style.opacity = 1;
  setTimeout(() => {
    if (mid) mid();
    setTimeout(() => {
      f.style.opacity = 0;
      setTimeout(() => { G.busy = false; f.textContent = ''; }, 500);
    }, 700);
  }, 550);
}

/* ---- menus ---- */
function mbtn(act, label, cls, extra) { return '<button class="mb ' + (cls || '') + '" data-act="' + act + '"' + (extra || '') + '>' + label + '</button>'; }
function nightRow() {
  let s = '<div class="nrow"><span>NOITE</span>';
  for (let n = 1; n <= 6; n++) s += '<button class="nb' + (n > G.best ? ' dis' : '') + (n === G.night ? ' sel' : '') + '" data-act="night" data-n="' + n + '">' + n + '</button>';
  return s + '</div>';
}

    mbtn('help', 'COMO JOGAR') +

function beginNight() {
  lockFail = false;
  lock();                 // precisa ser dentro do clique (gesto do usuário)
  startNight();
}

function resetNight() {
  G.t = 0; G.hour = 0; G.power = CONFIG.startPower; G.acc = 0; G.usage = 1;
  G.monitor = false; G.use = null; G.flash = false; G.powerOut = true; G.arrive = true; G.dawn = false;   // começa do lado de fora, sem energia
  G.loc = 'out'; G.busy = false; G.scare = null; G.shake = 0; G.cfg = false; $('settings').style.display = 'none';
  G.bat = 100; resetBatteries(); G.dead = false; G.pendingOver = null; MP.specId = null; MP.remoteLight = { L: false, R: false }; MP.remoteMon = 0; MP.genHolders = 0; Animatronics.remoteOpen = null;
  for (const id in MP.players) { const q = MP.players[id]; q.alive = true; q.loc = 'out'; q.use = null; q.flash = 0; q.monitor = 0; }
  G.stamina = 100; G.tired = false; G.stamT = 0; G.sprinting = false;
  G.genProg = 0; G.genUses = 0; G.toastT = 0;
  $('fade').style.opacity = 0; $('fade').textContent = '';
  for (const s of ['L', 'R']) { doors[s].closed = false; doors[s].p = 1; doors[s].mesh.position.y = doorY(1); }
  P.x = OUT.spawn.x; P.z = OUT.spawn.z; P.yaw = 0; P.pitch = 0;   // no estacionamento, de frente para a pizzaria
  syncMonitorUI();
  refreshButtons();
  Animatronics.reset();
}
function startNight() {
  Snd.init();
  resetNight();
  G.state = 'intro';
  G.introT = 2.8;
  if (MP.role === 'host') { MP.started = true; mpBroadcast({ t: 'start', night: G.night }); mpRoster(); }
  showScreen('12:00 AM', '<p>Noite ' + G.night + '</p><p>Você estacionou o carro em frente à pizzaria…</p>', '', 'intro');
  hideHud();
  Snd.setHum(0);
  updateHud();
}
function beginPlay() {
  G.state = 'playing';
  hideScreen();
  $('hud').style.display = 'block';
  $('cross').style.display = 'block';
  if (TOUCH) $('touch').style.display = 'block';
  Animatronics.init();
